feature: EnterInterviewRoom
title: Enter Interview Room
uc_id: ""
uc_label: "(UC-43 sub-flow)"
backlog: [54, 38]

participants:
  - name: Candidate
    kind: actor
    w: 30
  - name: ":Interview Room UI"
    kind: box
    w: 180
  - name: ":InterviewController\n(WebClient)"
    kind: box
    w: 200
  - name: ":InterviewService\n(WebClient)"
    kind: box
    w: 190
  - name: ":VerificationService\n(WebClient)"
    kind: box
    w: 200
  - name: ":API Gateway"
    kind: box
    w: 140
  - name: ":InterviewSessionController\n(InterviewAPI)"
    kind: box
    w: 250
  - name: ":SessionService\n(InterviewAPI)"
    kind: box
    w: 190
  - name: "SQL Server"
    kind: db
    w: 70

flow:
  # ---------------- Phase 1: the three Room-entry guards ----------------
  - {d: 0, t: 1, k: call, l: "1. Face verification passed -> redirected to the Room [see #13]"}
  - {d: 1, t: 2, k: call, l: "2. GET /Interview/Room/{id}"}
  - {d: 2, t: 3, k: call, l: "3. GetRoomAsync(id, ct)"}
  - {d: 3, t: 2, k: ret, l: "4. Return (Success, RoomViewModel, Error)"}
  - frame: opt
    sections:
      - guard: "[!statusOk OR room is null]"
        body:
          - {d: 2, t: 1, k: ret, l: "D.1. 302 RedirectToAction(Index)"}
          - {d: 1, t: 0, k: ret, l: "D.2. Interview dashboard with the error banner"}
  - frame: opt
    sections:
      - guard: '[room.Status not in ("Initialized","InProgress","Paused")]'
        body:
          - {d: 2, t: 1, k: ret, l: "E.1. 302 RedirectToAction(\"Report\", \"Evaluation\", {...})"}
          - {d: 1, t: 0, k: ret, l: "E.2. Evaluation report page [see #18]"}
  - {d: 2, t: 4, k: call, l: "5. GetEntryGateAsync(id, ct) [see #14]"}
  - {d: 4, t: 2, k: ret, l: "6. Return (Success, EntryGateStatusModel, Error)"}
  - frame: opt
    sections:
      - guard: "[!gateOk OR gate is null - fail closed]"
        body:
          - {d: 2, t: 1, k: ret, l: "F.1. 302 RedirectToAction(Index)"}
          - {d: 1, t: 0, k: ret, l: "F.2. Interview dashboard with the error banner"}
  - frame: opt
    sections:
      - guard: "[!gate.Allowed AND gate.FaceEnrolled AND gate.AttemptsRemaining > 0]"
        body:
          - {d: 2, t: 1, k: ret, l: "G.1. 302 RedirectToAction(Verify, { id })"}
          - {d: 1, t: 0, k: ret, l: "G.2. Biometric entry-gate screen (#13 VerifyFaceEntryGate)"}
  - frame: opt
    sections:
      - guard: "[!gate.Allowed AND (no face enrollment OR no attempts left)]"
        body:
          - {d: 2, t: 1, k: ret, l: "H.1. 302 RedirectToAction(Index)"}
          - {d: 1, t: 0, k: ret, l: "H.2. Interview dashboard explaining why the gate is closed"}
  - {d: 2, t: 3, k: call, l: "7. GetIntegrityPolicyStatusAsync(id, ct) [see #11]"}
  - {d: 3, t: 2, k: ret, l: "8. Return ApiCallResult<IntegrityPolicyStatusResponse>"}
  - frame: opt
    sections:
      - guard: "[!policyStatus.Success]"
        body:
          - {d: 2, t: 1, k: ret, l: "J.1. 302 RedirectToAction(Index)"}
          - {d: 1, t: 0, k: ret, l: "J.2. Interview dashboard with the error banner"}
  - frame: opt
    sections:
      - guard: "[policyStatus.Data?.Accepted != true]"
        body:
          - {d: 2, t: 1, k: ret, l: "K.1. 302 RedirectToAction(IntegrityPolicy, { id })"}
          - {d: 1, t: 0, k: ret, l: "K.2. Integrity policy page (#11 AcceptIntegrityPolicy)"}

  # ---------------- Phase 2: materialize the first question + charge the credit ----------------
  # The whole of GenerateQuestionAsync (three server-side guards, the atomic
  # Initialized->InProgress transition, the one-time credit charge, its rollback and refund)
  # is drawn in #20 ChargeAndActivateSession. Collapsed here to one call + return plus the
  # room-entry outcomes, the same way message 5 above defers to #14.
  - frame: opt
    sections:
      - guard: '[room.Status is "Initialized" or "InProgress" - a Paused session already has its current question and generate would reject it]'
        body:
          - {d: 2, t: 3, k: call, l: "L.1. GenerateQuestionAsync(id, ct) [see #20]"}
          - {d: 3, t: 2, k: ret, l: "L.2. Return (Success, Error)"}
          - frame: opt
            sections:
              - guard: "[!generated - any guard, credit or dependency failure inside #20]"
                body:
                  - {d: 2, t: 1, k: ret, l: 'M.1. TempData["ErrorMessage"]; 302 RedirectToAction(Index)'}
                  - {d: 1, t: 0, k: ret, l: "M.2. Interview dashboard with the error banner"}
          - {d: 2, t: 3, k: call, l: "L.3. GetRoomAsync(id, ct) AGAIN"}
          - {d: 3, t: 2, k: ret, l: "L.4. Return the fresh RoomViewModel"}
          - frame: opt
            sections:
              - guard: "[the GetRoomAsync re-fetch failed]"
                body:
                  - {d: 2, t: 1, k: ret, l: "N.1. 302 RedirectToAction(Index)"}
                  - {d: 1, t: 0, k: ret, l: "N.2. Interview dashboard with the error banner"}

  # ---------------- Phase 3: render the Room + first-ever product tour ----------------
  - {d: 2, t: 1, k: ret, l: "9. Return View Room (RoomViewModel)"}
  - frame: opt
    sections:
      - guard: "[first-ever Room visit for this user - hasSeenRoomTour is false]"
        body:
          - {d: 1, t: 2, k: call, l: "V.1. First-ever Room visit -> POST /Interview/TourSeen"}
          - {d: 2, t: 3, k: call, l: "V.2. MarkRoomTourSeenAsync(ct)"}
          - {d: 3, t: 5, k: call, l: "V.3. POST api/interview/room-tour/seen"}
          - {d: 5, t: 6, k: call, l: "V.4. Forward (route interview-route, no prefix strip)"}
          - {d: 6, t: 7, k: call, l: "V.5. MarkRoomTourSeenAsync(userId, ct)"}
          - {d: 7, t: 8, k: call, l: "V.6. UPSERT UserRoomTourStatus SET HasSeenRoomTour = true"}
          - {d: 8, t: 7, k: ret, l: "V.7. Return rows affected"}
          - {d: 7, t: 6, k: ret, l: "V.8. Return"}
          - {d: 6, t: 5, k: ret, l: 'V.9. Return 200 ApiResponse.Ok(new {}, "Marked.")'}
          - {d: 5, t: 3, k: ret, l: "V.10. Return 200"}
          - {d: 3, t: 2, k: ret, l: "V.11. Return (true, null)"}
          - {d: 2, t: 1, k: ret, l: "V.12. Return 200"}
  - {d: 1, t: 0, k: ret, l: "10. Interview Room: first question, countdown, camera [see #5]"}
