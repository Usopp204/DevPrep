feature: ReportCameraViolation
title: Report Camera Violation
uc_id: "UC-10"
uc_label: "[UC-46]"
backlog: [41]

participants:
  - name: Candidate
    kind: actor
    w: 30
  - name: ":Interview Room UI"
    kind: box
    w: 180
  - name: ":InterviewController\n(WebClient)"
    kind: box
    w: 200
  - name: ":InterviewService\n(WebClient)"
    kind: box
    w: 190
  - name: ":API Gateway"
    kind: box
    w: 140
  - name: ":InterviewSessionController\n(InterviewAPI)"
    kind: box
    w: 250
  - name: ":SessionService\n(InterviewAPI)"
    kind: box
    w: 190
  - name: ":SessionRepository\n(InterviewAPI)"
    kind: box
    w: 200
  - name: ":SessionVerificationEventRepository\n(InterviewAPI)"
    kind: box
    w: 280
  - name: ":CheatingStrikeHelper\n(InterviewAPI)"
    kind: box
    w: 200
  - name: "SQL Server"
    kind: db
    w: 70

flow:
  - {d: 0, t: 1, k: call, l: "1. [auto] Camera stops"}
  - {d: 1, t: 1, k: call, l: "2. scheduleCameraRecovery(reason); arm the 15s retry timer", self: true}
  - {d: 1, t: 1, k: call, l: "3. [after 15s] connectCamera() retry throws", self: true}
  - frame: opt
    sections:
      - guard: "[cameraIncidentReported == true - already reported for this camera-loss episode]"
        body:
          - {d: 1, t: 1, k: call, l: "F0.1. Skip the report", self: true}
          - {d: 1, t: 0, k: ret, l: "F0.2. Camera status stays red, retry loop keeps running"}
  - {d: 1, t: 1, k: call, l: "4. cameraIncidentReported = true; reportCameraViolation(reason)", self: true}
  - frame: opt
    sections:
      - guard: "[!cameraViolationUrl OR ended]"
        body:
          - {d: 1, t: 1, k: call, l: "F1.1. return early - no request sent", self: true}
          - {d: 1, t: 0, k: ret, l: "F1.2. Nothing shown"}
  - {d: 1, t: 2, k: call, l: "5. POST /Interview/CameraViolation?id={id}"}
  - {d: 2, t: 3, k: call, l: "6. ReportCameraViolationAsync(id, incidentId, reason, ct)"}
  - {d: 3, t: 4, k: call, l: "7. POST api/interview/sessions/{id}/camera-violation"}
  - {d: 4, t: 5, k: call, l: "8. Forward (route interview-route, no prefix strip)"}
  - {d: 5, t: 5, k: call, l: "9. Guid.Parse(User.FindFirstValue(ClaimTypes.NameIdentifier))", self: true}
  - {d: 5, t: 6, k: call, l: "10. ReportCameraViolationAsync(userId, sessionId, request, ct)"}
  - {d: 6, t: 7, k: call, l: "11. GetByIdAsync(sessionId, ct)"}
  - {d: 7, t: 10, k: call, l: "12. SELECT InterviewSession WHERE SessionId AND !IsDeleted"}
  - {d: 10, t: 7, k: ret, l: "13. Return session row / null"}
  - {d: 7, t: 6, k: ret, l: "14. Return InterviewSession?"}
  - frame: opt
    sections:
      - guard: "[session is null OR session.UserId != userId]"
        body:
          - {d: 6, t: 5, k: ret, l: 'G1.1. throw InvalidOperationException("Session not found.")'}
          - {d: 5, t: 4, k: ret, l: "G1.2. Return 400 ApiResponse.Fail(ex.Message)"}
          - {d: 4, t: 3, k: ret, l: "G1.3. Return 400"}
          - {d: 3, t: 2, k: ret, l: "G1.4. Return ApiCallResult.Fail(message, 400)"}
          - {d: 2, t: 1, k: ret, l: "G1.5. Return 400 { error }"}
          - {d: 1, t: 0, k: ret, l: "G1.6. setCheatingWarning(\"Camera incident could not be reported\")"}
  - frame: opt
    sections:
      - guard: '[session.Status not in ("InProgress","Paused")]'
        body:
          - {d: 6, t: 5, k: ret, l: 'G2.1. throw InvalidOperationException("Session is not active.")'}
          - {d: 5, t: 4, k: ret, l: "G2.2. Return 400 ApiResponse.Fail(ex.Message)"}
          - {d: 4, t: 3, k: ret, l: "G2.3. Return 400"}
          - {d: 3, t: 2, k: ret, l: "G2.4. Return ApiCallResult.Fail(message, 400)"}
          - {d: 2, t: 1, k: ret, l: "G2.5. Return 400 { error }"}
          - {d: 1, t: 0, k: ret, l: "G2.6. setCheatingWarning(\"Camera incident could not be reported\")"}
  - frame: opt
    sections:
      - guard: "[req.IncidentId == Guid.Empty]"
        body:
          - {d: 6, t: 5, k: ret, l: 'G3.1. throw InvalidOperationException("IncidentId is required.")'}
          - {d: 5, t: 4, k: ret, l: "G3.2. Return 400 ApiResponse.Fail(ex.Message)"}
          - {d: 4, t: 3, k: ret, l: "G3.3. Return 400"}
          - {d: 3, t: 2, k: ret, l: "G3.4. Return ApiCallResult.Fail(message, 400)"}
          - {d: 2, t: 1, k: ret, l: "G3.5. Return 400 { error }"}
          - {d: 1, t: 0, k: ret, l: "G3.6. setCheatingWarning(\"Camera incident could not be reported\")"}
  - frame: opt
    sections:
      - guard: '[req.Reason not in ("PermissionDenied","Disconnected")]'
        body:
          - {d: 6, t: 5, k: ret, l: "G4.1. throw InvalidOperationException"}
          - {d: 5, t: 4, k: ret, l: "G4.2. Return 400 ApiResponse.Fail(ex.Message)"}
          - {d: 4, t: 3, k: ret, l: "G4.3. Return 400"}
          - {d: 3, t: 2, k: ret, l: "G4.4. Return ApiCallResult.Fail(message, 400)"}
          - {d: 2, t: 1, k: ret, l: "G4.5. Return 400 { error }"}
          - {d: 1, t: 0, k: ret, l: "G4.6. setCheatingWarning(\"Camera incident could not be reported\")"}
  - {d: 6, t: 6, k: call, l: "15. Read maxStrikes, strictness, noFaceStrikeThreshold", self: true}
  - {d: 6, t: 8, k: call, l: "16. TryAddIncidentAsync(SessionVerificationEvent)"}
  - {d: 8, t: 10, k: call, l: "17. INSERT SessionVerificationEvent (SaveChangesAsync)"}
  - frame: alt
    sections:
      - guard: "[INSERT succeeded]"
        body:
          - {d: 10, t: 8, k: ret, l: "H-a.1. Return rows affected"}
          - {d: 8, t: 6, k: ret, l: "H-a.2. Return inserted = true"}
      - guard: "[unique index on IncidentId rejects it - the same incident was already reported]"
        body:
          - {d: 10, t: 8, k: ret, l: "H-b.1. throw DbUpdateException (unique index on IncidentId)"}
          - {d: 8, t: 8, k: call, l: "H-b.2. catch DbUpdateException; detach the entity", self: true}
          - {d: 8, t: 10, k: call, l: "H-b.3. SELECT EXISTS SessionVerificationEvents WHERE IncidentId"}
          - {d: 10, t: 8, k: ret, l: "H-b.4. Return true"}
          - {d: 8, t: 6, k: ret, l: "H-b.5. Return inserted = false"}
  - frame: alt
    sections:
      - guard: "[inserted == true]"
        body:
          - {d: 6, t: 7, k: call, l: "J-a.1. IncrementCameraViolationAsync(sessionId, ct)"}
          - {d: 7, t: 10, k: call, l: "J-a.2. UPDATE InterviewSessions SET CameraViolationCount + 1"}
          - {d: 10, t: 7, k: ret, l: "J-a.3. Return rows affected"}
          - {d: 7, t: 10, k: call, l: "J-a.4. SELECT CameraViolationCount WHERE SessionId"}
          - {d: 10, t: 7, k: ret, l: "J-a.5. Return CameraViolationCount"}
          - {d: 7, t: 6, k: ret, l: "J-a.6. Return int count"}
      - guard: "[inserted == false - duplicate report]"
        body:
          - {d: 6, t: 10, k: call, l: "J-b.1. SELECT CameraViolationCount WHERE SessionId"}
          - {d: 10, t: 6, k: ret, l: "J-b.2. Return CameraViolationCount"}
  - {d: 6, t: 8, k: call, l: '20. ListBySessionAsync(sessionId, "InSession", ct)'}
  - {d: 8, t: 10, k: call, l: "21. SELECT SessionVerificationEvents WHERE Phase=\"InSession\""}
  - {d: 10, t: 8, k: ret, l: "22. Return event rows"}
  - {d: 8, t: 6, k: ret, l: "23. Return List<SessionVerificationEvent>"}
  - {d: 6, t: 9, k: call, l: "24. ComputeEffectiveStrikeCount(events, noFaceStrikeThreshold)"}
  - {d: 9, t: 6, k: ret, l: "25. Return directStrikeCount + noFaceCount / threshold"}
  - {d: 6, t: 6, k: call, l: "26. Compute displayStrikeCount and shouldEndSession", self: true}
  - frame: opt
    sections:
      - guard: "[shouldEndSession == true]"
        body:
          - {d: 6, t: 6, k: call, l: "K.1. session.Status=\"Cancelled\"; EndedAt=now", self: true}
          - {d: 6, t: 7, k: call, l: "K.2. GetRoomBySessionAsync(sessionId, ct)"}
          - {d: 7, t: 10, k: call, l: "K.3. SELECT InterviewRoom WHERE SessionId"}
          - {d: 10, t: 7, k: ret, l: "K.4. Return room row / null"}
          - {d: 7, t: 6, k: ret, l: "K.5. Return InterviewRoom?"}
          - frame: alt
            sections:
              - guard: "[room is not null]"
                body:
                  - {d: 6, t: 7, k: call, l: 'L-a.1. UpdateRoomAsync(room{Status="Closed", ClosedAt=now}, ct)'}
                  - {d: 7, t: 10, k: call, l: "L-a.2. UPDATE InterviewSessions SET Status, EndedAt + InterviewRoom"}
                  - {d: 10, t: 7, k: ret, l: "L-a.3. Return rows affected"}
                  - {d: 7, t: 6, k: ret, l: "L-a.4. Return"}
              - guard: "[room is null]"
                body:
                  - {d: 6, t: 7, k: call, l: "L-b.1. SaveChangesAsync(ct)"}
                  - {d: 7, t: 10, k: call, l: "L-b.2. UPDATE InterviewSession SET Status, EndedAt, UpdatedAt"}
                  - {d: 10, t: 7, k: ret, l: "L-b.3. Return rows affected"}
                  - {d: 7, t: 6, k: ret, l: "L-b.4. Return"}
  - {d: 6, t: 5, k: ret, l: "27. Return ReportCameraViolationResponse"}
  - {d: 5, t: 4, k: ret, l: "28. Return 200 ApiResponse.Ok(result)"}
  - {d: 4, t: 3, k: ret, l: "29. Return 200"}
  - {d: 3, t: 2, k: ret, l: "30. Return ApiCallResult.Ok(CameraViolationResultModel, 200)"}
  - {d: 2, t: 1, k: ret, l: "31. Return 200 JSON (CameraViolationResultModel)"}
  - frame: alt
    sections:
      - guard: "[data.duplicate == true]"
        body:
          - {d: 1, t: 0, k: ret, l: "M-a.1. Nothing shown - the duplicate report is silently ignored"}
      - guard: "[!duplicate AND !shouldEndSession]"
        body:
          - {d: 1, t: 1, k: call, l: "M-b.1. setCheatingWarning(strikeText, \"critical\")", self: true}
          - {d: 1, t: 0, k: ret, l: "M-b.2. Show \"Integrity violation\" alert + modal"}
      - guard: "[!duplicate AND shouldEndSession]"
        body:
          - {d: 1, t: 1, k: call, l: "M-c.1. handleForcedCheatingEnd(message): ended=true", self: true}
          - {d: 1, t: 0, k: ret, l: "M-c.2. Show termination modal -> redirect to /Interview"}
