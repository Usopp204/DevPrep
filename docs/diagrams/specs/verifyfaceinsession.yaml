feature: VerifyFaceInSession
title: Verify Face In Session
uc_id: "UC-10"
uc_label: "[UC-54]"
backlog: [50, 51]

participants:
  - name: Candidate
    kind: actor
    w: 30
  - name: ":Interview Room UI"
    kind: box
    w: 180
  - name: ":VerificationController\n(WebClient)"
    kind: box
    w: 210
  - name: ":VerificationService\n(WebClient)"
    kind: box
    w: 190
  - name: ":API Gateway"
    kind: box
    w: 140
  - name: ":SessionVerificationController\n(InterviewAPI)"
    kind: box
    w: 250
  - name: ":BiometricVerificationService\n(InterviewAPI)"
    kind: box
    w: 240
  - name: ":SessionRepository\n(InterviewAPI)"
    kind: box
    w: 180
  - name: ":SessionVerificationEventRepository\n(InterviewAPI)"
    kind: box
    w: 280
  - name: ":ProfileBiometricsRepository\n(InterviewAPI)"
    kind: box
    w: 230
  - name: ":CheatingStrikeHelper\n(InterviewAPI)"
    kind: box
    w: 200
  - name: ":AiServiceClient\n(InterviewAPI)"
    kind: box
    w: 190
  - name: ":ai-service\n/internal/biometrics/verify"
    kind: box
    w: 320
  - name: "SQL Server"
    kind: db
    w: 70

flow:
  - {d: 0, t: 1, k: call, l: "1. Next question carries a verificationCheckId [see #5]"}
  - {d: 1, t: 1, k: call, l: "2. applyNextQuestion(): show question, after typing delay", self: true}
  - {d: 1, t: 1, k: call, l: "3. captureAndVerifyInSession(): grab 1 frame", self: true}
  - frame: opt
    sections:
      - guard: "[ended OR paused OR !verifyInSessionUrl OR !checkId OR !cameraStream OR request already in flight OR checkId locally expired]"
        body:
          - {d: 1, t: 1, k: call, l: "F0.1. return early - no request sent", self: true}
          - {d: 1, t: 0, k: ret, l: "F0.2. Nothing shown"}
  - {d: 1, t: 2, k: call, l: "4. POST Verification/VerifyInSession (multipart)"}
  - {d: 2, t: 3, k: call, l: "5. VerifyInSessionAsync(sessionId, checkId, frame, ...)"}
  - {d: 3, t: 4, k: call, l: "6. POST api/interview/sessions/{id}/verify/in-session"}
  - {d: 4, t: 5, k: call, l: "7. Forward (route interview-route, no prefix strip)"}
  - {d: 5, t: 5, k: call, l: "8. Guid.Parse(User.FindFirstValue(ClaimTypes.NameIdentifier))", self: true}
  - {d: 5, t: 6, k: call, l: "9. VerifyInSessionAsync(userId, sessionId, checkId, frame)"}
  - {d: 6, t: 6, k: call, l: "10. EnsureEnabled()", self: true}
  - frame: opt
    sections:
      - guard: "[Biometrics:Enabled == false]"
        body:
          - {d: 6, t: 5, k: ret, l: "10.1. throw InvalidOperationException"}
          - {d: 5, t: 4, k: ret, l: "10.2. Return 400 ApiResponse.Fail(ex.Message)"}
          - {d: 4, t: 3, k: ret, l: "10.3. Return 400"}
          - {d: 3, t: 2, k: ret, l: "10.4. Return (false, null, error)"}
          - {d: 2, t: 1, k: ret, l: "10.5. Return 400 {error}"}
          - {d: 1, t: 0, k: ret, l: 'setCheatingWarning(errorMessage, "warning")'}
  - {d: 6, t: 7, k: call, l: "11. GetByIdAsync(sessionId)"}
  - {d: 7, t: 13, k: call, l: "12. SELECT InterviewSession by SessionId"}
  - {d: 13, t: 7, k: ret, l: "13. Return session row / null"}
  - {d: 7, t: 6, k: ret, l: "14. Return InterviewSession?"}
  - frame: opt
    sections:
      - guard: "[session is null OR session.UserId != userId]"
        body:
          - {d: 6, t: 5, k: ret, l: '14.1. throw KeyNotFoundException("Session not found.")'}
          - {d: 5, t: 4, k: ret, l: "14.2. Return 404 ApiResponse.Fail(ex.Message)"}
          - {d: 4, t: 3, k: ret, l: "14.3. Return 404"}
          - {d: 3, t: 2, k: ret, l: "14.4. Return (false, null, error)"}
          - {d: 2, t: 1, k: ret, l: "14.5. Return 400 {error}"}
          - {d: 1, t: 0, k: ret, l: 'setCheatingWarning(errorMessage, "warning")'}
  - frame: opt
    sections:
      - guard: '[session.Status != "InProgress"]'
        body:
          - {d: 6, t: 5, k: ret, l: "14.6. throw InvalidOperationException"}
          - {d: 5, t: 4, k: ret, l: "14.7. Return 400 ApiResponse.Fail(ex.Message)"}
          - {d: 4, t: 3, k: ret, l: "14.8. Return 400"}
          - {d: 3, t: 2, k: ret, l: "14.9. Return (false, null, error)"}
          - {d: 2, t: 1, k: ret, l: "14.10. Return 400 {error}"}
          - {d: 1, t: 0, k: ret, l: 'setCheatingWarning(errorMessage, "warning")'}
  - {d: 6, t: 8, k: call, l: "15. TryConsumeQuestionCheckAsync(...)"}
  - {d: 8, t: 13, k: call, l: "16. UPDATE SessionVerificationEvent SET ConsumedAt, Decision"}
  - {d: 13, t: 8, k: ret, l: "17. Return rows affected"}
  - {d: 8, t: 6, k: ret, l: "18. Return bool (affected == 1)"}
  - frame: opt
    sections:
      - guard: "[TryConsumeQuestionCheckAsync == false]"
        body:
          - {d: 6, t: 5, k: ret, l: "18.1. throw InvalidOperationException"}
          - {d: 5, t: 4, k: ret, l: "18.2. Return 400 ApiResponse.Fail(ex.Message)"}
          - {d: 4, t: 3, k: ret, l: "18.3. Return 400"}
          - {d: 3, t: 2, k: ret, l: "18.4. Return (false, null, error)"}
          - {d: 2, t: 1, k: ret, l: "18.5. Return 400 {error}"}
          - {d: 1, t: 0, k: ret, l: "18.6. isVerificationTokenError(errorMessage)"}
  - {d: 6, t: 9, k: call, l: '19. GetAsync(userId, "Face") (via GetStoredEmbeddingAsync)'}
  - {d: 9, t: 13, k: call, l: '20. SELECT ProfileBiometric WHERE UserId AND Modality="Face"'}
  - {d: 13, t: 9, k: ret, l: "21. Return row / null"}
  - {d: 9, t: 6, k: ret, l: "22. Return ProfileBiometric?"}
  - frame: opt
    sections:
      - guard: "[row is null]"
        body:
          - {d: 6, t: 5, k: ret, l: "22.1. throw InvalidOperationException"}
          - {d: 5, t: 4, k: ret, l: "22.2. Return 400 ApiResponse.Fail(ex.Message)"}
          - {d: 4, t: 3, k: ret, l: "22.3. Return 400"}
          - {d: 3, t: 2, k: ret, l: "22.4. Return (false, null, error)"}
          - {d: 2, t: 1, k: ret, l: "22.5. Return 400 {error}"}
          - {d: 1, t: 0, k: ret, l: 'setCheatingWarning(errorMessage, "warning")'}
  - {d: 6, t: 11, k: call, l: "23. VerifyFaceAsync(frame, embedding)"}
  - {d: 11, t: 12, k: call, l: "24. POST /internal/biometrics/verify (form)"}
  - frame: alt
    sections:
      - guard: "[identity match, exactly one face]"
        body:
          - {d: 12, t: 11, k: ret, l: "G.1. 200 VerifyResponse{match, score, threshold}"}
          - {d: 11, t: 6, k: ret, l: "G.2. Return AiFaceVerifyResponse"}
          - {d: 6, t: 6, k: call, l: "G.3. isStrike, decision, warningType from Match", self: true}
      - guard: "[more than one face detected]"
        body:
          - {d: 12, t: 11, k: ret, l: 'H.1. 422 {code:"multiple_faces", face_count, message}'}
          - {d: 11, t: 6, k: ret, l: "H.2. throw BiometricQualityException(\"multiple_faces\", ...)"}
          - {d: 6, t: 6, k: call, l: "H.3. catch \"multiple_faces\" -> decision=\"Flag\"", self: true}
      - guard: "[other quality rejection]"
        body:
          - {d: 12, t: 11, k: ret, l: "I.1. Return 422 {code, message}"}
          - {d: 11, t: 6, k: ret, l: "I.2. throw BiometricQualityException(message, qualityCode)"}
          - {d: 6, t: 6, k: call, l: "I.3. catch -> decision=\"NoFace\"/\"Quality\"; map warningType", self: true}
  - {d: 6, t: 8, k: call, l: "25. AddAsync(SessionVerificationEvent)"}
  - {d: 8, t: 13, k: call, l: "26. INSERT SessionVerificationEvent"}
  - {d: 13, t: 8, k: ret, l: "27. Return"}
  - {d: 8, t: 6, k: ret, l: "28. Return"}
  - {d: 6, t: 8, k: call, l: '29. ListBySessionAsync(sessionId, "InSession") (count strikes)'}
  - {d: 8, t: 13, k: call, l: "30. SELECT SessionVerificationEvents WHERE Phase=\"InSession\""}
  - {d: 13, t: 8, k: ret, l: "31. Return event list"}
  - {d: 8, t: 6, k: ret, l: "32. Return List<SessionVerificationEvent>"}
  - {d: 6, t: 6, k: call, l: "33. Count noFaceCount (Modality=Face AND Decision=NoFace)", self: true}
  - {d: 6, t: 10, k: call, l: "34. ComputeEffectiveStrikeCount(events, noFaceStrikeThreshold)"}
  - {d: 10, t: 6, k: ret, l: "35. Return directStrikeCount + noFaceCount/noFaceStrikeThreshold"}
  - {d: 6, t: 6, k: call, l: "36. Compute strike counters and shouldEndSession", self: true}
  - frame: opt
    sections:
      - guard: "[shouldEndSession == true]"
        body:
          - {d: 6, t: 7, k: call, l: "J.1. GetByIdAsync(sessionId) (via EndSessionForCheatingAsync)"}
          - {d: 7, t: 13, k: call, l: "J.2. SELECT InterviewSession by SessionId"}
          - {d: 13, t: 7, k: ret, l: "J.3. Return session"}
          - {d: 7, t: 6, k: ret, l: "J.4. Return session"}
          - {d: 6, t: 6, k: call, l: 'J.5. session.Status="Cancelled", EndedAt=now', self: true}
          - {d: 6, t: 7, k: call, l: "J.6. GetRoomBySessionAsync(sessionId)"}
          - {d: 7, t: 13, k: call, l: "J.7. SELECT InterviewRoom by SessionId"}
          - {d: 13, t: 7, k: ret, l: "J.8. Return room / null"}
          - {d: 7, t: 6, k: ret, l: "J.9. Return InterviewRoom?"}
          - frame: alt
            sections:
              - guard: "[room is not null]"
                body:
                  - {d: 6, t: 7, k: call, l: 'J.10. UpdateRoomAsync(room{Status="Closed", ClosedAt=now})'}
                  - {d: 7, t: 13, k: call, l: "J.11. UPDATE InterviewSessions SET Status, EndedAt + InterviewRoom"}
                  - {d: 13, t: 7, k: ret, l: "J.12. Return"}
                  - {d: 7, t: 6, k: ret, l: "J.12.1. Return"}
              - guard: "[room is null]"
                body:
                  - {d: 6, t: 7, k: call, l: "J.13. SaveChangesAsync()"}
                  - {d: 7, t: 13, k: call, l: "J.13.1. UPDATE InterviewSession SET Status,EndedAt"}
                  - {d: 13, t: 7, k: ret, l: "J.13.2. Return"}
                  - {d: 7, t: 6, k: ret, l: "J.13.3. Return"}
  - {d: 6, t: 5, k: ret, l: "37. Return InSessionVerifyResponse"}
  - {d: 5, t: 4, k: ret, l: "38. Return 200 ApiResponse.Ok(result)"}
  - {d: 4, t: 3, k: ret, l: "39. Return 200"}
  - {d: 3, t: 2, k: ret, l: "40. Return (true, result, null)"}
  - {d: 2, t: 1, k: ret, l: "41. Return 200 JSON"}
  - frame: alt
    sections:
      - guard: "[data.passed == true]"
        body:
          - {d: 1, t: 0, k: ret, l: "K.1. setCheatingWarning(null) - hide warning, nothing shown"}
      - guard: '[warningType=="NoFace" AND !noFaceJustBecameStrike]'
        body:
          - {d: 1, t: 0, k: ret, l: "K.2. Gentle notice banner, no strike count shown"}
      - guard: "[warningType is a quality issue (ImageTooBlurry/FaceTooSmall/LowDetectionConfidence/CannotDecode)]"
        body:
          - {d: 1, t: 0, k: ret, l: "K.3. Notice banner (lighting/distance/connection guidance)"}
      - guard: "[IdentityMismatch OR MultiFace OR NoFace just became a strike]"
        body:
          - {d: 1, t: 0, k: ret, l: "K.4. Show warning banner (StrikeCount/MaxStrikes)"}
          - frame: opt
            sections:
              - guard: "[data.shouldEndSession == true]"
                body:
                  - {d: 1, t: 1, k: call, l: "L.1. Show modal \"Interview ended\" -> redirect to /Interview", self: true}
