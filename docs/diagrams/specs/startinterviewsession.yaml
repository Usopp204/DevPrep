feature: StartInterviewSession
title: Start Interview Session
uc_id: ""
uc_label: "(UC-33 sub-flow)"
backlog: [55, 45, 46]

participants:
  - name: Candidate
    kind: actor
    w: 30
  - name: ":Interview Dashboard UI"
    kind: box
    w: 210
  - name: ":InterviewController\n(WebClient)"
    kind: box
    w: 200
  - name: ":InterviewService\n(WebClient)"
    kind: box
    w: 190
  - name: ":API Gateway"
    kind: box
    w: 140
  - name: ":InterviewSessionController\n(InterviewAPI)"
    kind: box
    w: 250
  - name: ":SessionService\n(InterviewAPI)"
    kind: box
    w: 190
  - name: ":ProfileBiometricsRepository\n(InterviewAPI)"
    kind: box
    w: 250
  - name: ":AiServiceClient\n(InterviewAPI)"
    kind: box
    w: 190
  - name: ":ai-service\n/internal/questions/plan"
    kind: box
    w: 260
  - name: ":SessionRepository\n(InterviewAPI)"
    kind: box
    w: 200
  - name: "SQL Server"
    kind: db
    w: 70

flow:
  - {d: 0, t: 1, k: call, l: "1. Click Start Interview [see #3]"}
  - {d: 1, t: 2, k: call, l: "2. POST /Interview/Start"}
  - {d: 2, t: 3, k: call, l: "3. StartInterviewAsync(...)"}
  - {d: 3, t: 4, k: call, l: "4. POST api/interview/sessions/init"}
  - {d: 4, t: 5, k: call, l: "5. Forward (route interview-route, no prefix strip)"}
  - {d: 5, t: 5, k: call, l: "6. Guid.Parse(User.FindFirstValue(ClaimTypes.NameIdentifier))", self: true}
  - {d: 5, t: 6, k: call, l: "7. InitAsync(userId, req, ct)"}
  - {d: 6, t: 10, k: call, l: "8. GetByIdAsync(req.SessionId, ct) - Step A"}
  - {d: 10, t: 11, k: call, l: "9. SELECT InterviewSession WHERE SessionId AND !IsDeleted"}
  - {d: 11, t: 10, k: ret, l: "10. Return row / null"}
  - {d: 10, t: 6, k: ret, l: "11. Return InterviewSession?"}
  - frame: opt
    sections:
      - guard: '[session is null OR session.UserId != userId OR session.Status != "Configured"]'
        body:
          - {d: 6, t: 5, k: ret, l: "A.1. throw InvalidOperationException"}
          - {d: 5, t: 4, k: ret, l: "A.2. Return 400 ApiResponse.Fail(ex.Message)"}
          - {d: 4, t: 3, k: ret, l: "A.3. Return 400"}
          - {d: 3, t: 2, k: ret, l: "A.4. Return StartInterviewResult.Failure(...)"}
          - {d: 2, t: 1, k: ret, l: "A.5. Return View Index"}
          - {d: 1, t: 0, k: ret, l: "A.6. Dashboard with the error banner"}
  - {d: 6, t: 7, k: call, l: "12. GetAsync(userId, \"Face\", ct) [see #3]"}
  - {d: 7, t: 11, k: call, l: '13. SELECT ProfileBiometric WHERE UserId AND Modality="Face"'}
  - {d: 11, t: 7, k: ret, l: "14. Return row / null"}
  - {d: 7, t: 6, k: ret, l: "15. Return ProfileBiometric?"}
  - frame: opt
    sections:
      - guard: "[Biometrics:Enabled AND this user has no Face enrollment]"
        body:
          - {d: 6, t: 5, k: ret, l: "B.1. throw InvalidOperationException"}
          - {d: 5, t: 4, k: ret, l: "B.2. Return 400 ApiResponse.Fail(ex.Message)"}
          - {d: 4, t: 3, k: ret, l: "B.3. Return 400"}
          - {d: 3, t: 2, k: ret, l: "B.4. Return StartInterviewResult.Failure(error)"}
          - {d: 2, t: 1, k: ret, l: "B.5. Return View Index (dashboard + ErrorMessage)"}
          - {d: 1, t: 0, k: ret, l: "B.6. Dashboard with the error banner"}
  - {d: 6, t: 6, k: call, l: "16. session.Position = req.Position; build AiQuestionPlanRequest", self: true}
  - {d: 6, t: 8, k: call, l: "17. PlanQuestionsAsync(planRequest, ct) - Step C"}
  - {d: 8, t: 9, k: call, l: "18. POST /internal/questions/plan (header X-Internal-Api-Key)"}
  - {d: 9, t: 9, k: call, l: "19. build_interview_plan()", self: true}
  - {d: 9, t: 8, k: ret, l: "20. Return 200 {questions}"}
  - {d: 8, t: 6, k: ret, l: "21. Return AiQuestionPlanResponse{Questions}"}
  - frame: opt
    sections:
      - guard: "[the plan is null OR it returned 0 questions]"
        body:
          - {d: 6, t: 5, k: ret, l: "C.1. throw InvalidOperationException"}
          - {d: 5, t: 4, k: ret, l: "C.2. Return 400 ApiResponse.Fail(ex.Message)"}
          - {d: 4, t: 3, k: ret, l: "C.3. Return 400"}
          - {d: 3, t: 2, k: ret, l: "C.4. Return StartInterviewResult.Failure(error)"}
          - {d: 2, t: 1, k: ret, l: "C.5. Return View Index (dashboard + ErrorMessage)"}
          - {d: 1, t: 0, k: ret, l: "C.6. Dashboard with the error banner"}
  - {d: 6, t: 6, k: call, l: "22. Map each planned question to SessionQuestion", self: true}
  - {d: 6, t: 10, k: call, l: "23. AddSessionQuestionsAsync(questions, ct) - Step E"}
  - {d: 10, t: 11, k: call, l: "24. INSERT SessionQuestions in one batch (SaveChangesAsync)"}
  - {d: 11, t: 10, k: ret, l: "25. Return rows affected"}
  - {d: 10, t: 6, k: ret, l: "26. Return"}
  - {d: 6, t: 10, k: call, l: "27. SaveChangesAsync(ct)"}
  - {d: 10, t: 11, k: call, l: "28. UPDATE InterviewSessions SET Status"}
  - {d: 11, t: 10, k: ret, l: "29. Return rows affected"}
  - {d: 10, t: 6, k: ret, l: "30. Return"}
  - {d: 6, t: 10, k: call, l: "31. CreateRoomAsync(InterviewRoom)"}
  - {d: 10, t: 11, k: call, l: "32. INSERT InterviewRoom (SaveChangesAsync)"}
  - {d: 11, t: 10, k: ret, l: "33. Return rows affected"}
  - {d: 10, t: 6, k: ret, l: "34. Return InterviewRoom"}
  - {d: 6, t: 5, k: ret, l: "35. Return InitResponse"}
  - {d: 5, t: 4, k: ret, l: "36. Return 200 ApiResponse.Ok(result)"}
  - {d: 4, t: 3, k: ret, l: "37. Return 200"}
  - {d: 3, t: 2, k: ret, l: "38. Return StartInterviewResult.Ok(sessionId)"}
  - {d: 2, t: 1, k: ret, l: "39. 302 RedirectToAction(Verify, { id = sessionId })"}
  - {d: 1, t: 0, k: ret, l: "40. Biometric entry-gate screen [see #13]"}
