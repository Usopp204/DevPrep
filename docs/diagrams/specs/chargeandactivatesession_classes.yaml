      - "+ DurationToCreditCost: Dictionary<int, int>"
    methods:
      - "+ GetCreditCost(durationMinutes: int): int"

  - name: SessionGuardException
    column: 2
    w: 340
    fields:
      - "+ StatusCode: int"
      - "+ ErrorCode: string"
      - "+ RetryAfterSeconds: int?"
      - "+ ActiveSessionId: Guid?"
    methods: []

  - name: CreditServiceUnavailableException
    column: 2
    w: 340
    fields: []
    methods:
      - "+ CreditServiceUnavailableException()"

  - name: InvalidOperationException
    column: 2
    fields: []
    methods: []

