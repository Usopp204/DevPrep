    column: 5

classes:
  # ---------- column 0: WebClient ----------
  - name: "InterviewController (WebClient)"
    column: 0
    w: 360
    fields:
      - "- interviewService: IInterviewService"
      - "- biometricsService: IBiometricsService"
      - "- verificationService: IVerificationService"
      - "- feedbackService: IFeedbackService"
      - "- paymentService: IPaymentService"
    methods:
      - "+ Room(id: Guid, ct: CancellationToken): Task<IActionResult>"

  - name: "IInterviewService (WebClient)"
    column: 0
    w: 380
    fields: []
    methods:
      - "+ GenerateQuestionAsync(sessionId: Guid, ct: CancellationToken): Task<(bool Success, string? Error)>"
      - "+ GetRoomAsync(sessionId: Guid, ct: CancellationToken): Task<(bool Success, RoomViewModel? Room, string? Error)>"

  - name: "InterviewService (WebClient)"
    column: 0
    w: 380
    fields:
      - "- apiClient: IApiClient"
    methods:
      - "+ GenerateQuestionAsync(sessionId: Guid, ct: CancellationToken): Task<(bool Success, string? Error)>"
      - "+ GetRoomAsync(sessionId: Guid, ct: CancellationToken): Task<(bool Success, RoomViewModel? Room, string? Error)>"
      - "- SendAsync<T>(method: HttpMethod, path: string, body: object?, ct: CancellationToken): Task<ApiCallResult<T>>"

  # ---------- column 1: InterviewAPI controller + service ----------
  - name: "InterviewSessionController (InterviewAPI)"
    column: 1
    w: 400
    fields:
      - "- _service: ISessionService"
      - "- _logger: ILogger<InterviewSessionController>"
    methods:
      - "+ GenerateQuestion(id: Guid, ct: CancellationToken): Task<IActionResult>"

  - name: ISessionService
    column: 1
    w: 420
    fields: []
    methods:
      - "+ GenerateQuestionAsync(userId: Guid, sessionId: Guid, ct: CancellationToken): Task<GenerateQuestionResponse>"

  - name: "SessionService (InterviewAPI)"
    column: 1
    w: 420
    fields:
      - "- _repo: ISessionRepository"
      - "- _paymentApiClient: IPaymentApiClient"
      - "- _verificationEventRepository: ISessionVerificationEventRepository"
      - "- _db: InterviewDbContext"
      - "- _configuration: IConfiguration"
      - "- _logger: ILogger<SessionService>"
    methods:
      - "+ GenerateQuestionAsync(userId: Guid, sessionId: Guid, ct: CancellationToken): Task<GenerateQuestionResponse>"
      - "- RequireIntegrityPolicyAccepted(session: InterviewSession): void"
      - "- GetIdleThresholds(difficulty: string?): (int Reminder, int Hard)"
      - "- GetEffectivePausedSeconds(session: InterviewSession): int"

  # ---------- column 2: DTOs, helpers, exceptions ----------
  - name: GenerateQuestionResponse
    column: 2
    w: 300
    fields:
      - "+ SessionQuestionId: Guid"
      - "+ OrderIndex: int"
      - "+ Content: string"
      - "+ TotalQuestions: int"
      - "+ Ended: bool"
      - "+ IdleReminderSeconds: int"
      - "+ IdleHardSeconds: int"
      - "+ IdleElapsedSeconds: int"
