feature: AcceptIntegrityPolicy
title: Accept Integrity Policy
uc_id: ""
uc_label: "[UC-40]"
backlog: [63, 64]

participants:
  - name: Candidate
    kind: actor
    w: 30
  - name: ":Integrity Policy UI"
    kind: box
    w: 190
  - name: ":InterviewController\n(WebClient)"
    kind: box
    w: 200
  - name: ":InterviewService\n(WebClient)"
    kind: box
    w: 190
  - name: ":API Gateway"
    kind: box
    w: 140
  - name: ":InterviewSessionController\n(InterviewAPI)"
    kind: box
    w: 250
  - name: ":SessionService\n(InterviewAPI)"
    kind: box
    w: 190
  - name: ":SessionRepository\n(InterviewAPI)"
    kind: box
    w: 200
  - name: "SQL Server"
    kind: db
    w: 70

flow:
  # ---------------- Phase 1: GET status + render the policy page ----------------
  - {d: 0, t: 1, k: call, l: "1. Redirected to /Interview/IntegrityPolicy [see #4]"}
  - {d: 1, t: 2, k: call, l: "2. GET /Interview/IntegrityPolicy?id={sessionId}"}
  - {d: 2, t: 3, k: call, l: "3. GetIntegrityPolicyStatusAsync(id, ct)"}
  - {d: 3, t: 4, k: call, l: "4. GET api/interview/sessions/{sessionId}/integrity-policy"}
  - {d: 4, t: 5, k: call, l: "5. Forward (route interview-route, no prefix strip)"}
  - {d: 5, t: 5, k: call, l: "6. Guid.Parse(User.FindFirstValue(ClaimTypes.NameIdentifier))", self: true}
  - {d: 5, t: 6, k: call, l: "7. GetIntegrityPolicyStatusAsync(userId, sessionId, ct)"}
  - {d: 6, t: 7, k: call, l: "8. GetByIdAsync(sessionId, ct)"}
  - {d: 7, t: 8, k: call, l: "9. SELECT InterviewSession WHERE SessionId AND !IsDeleted"}
  - {d: 8, t: 7, k: ret, l: "10. Return session row / null"}
  - {d: 7, t: 6, k: ret, l: "11. Return InterviewSession?"}
  - frame: opt
    sections:
      - guard: "[session is null OR session.UserId != userId]"
        body:
          - {d: 6, t: 5, k: ret, l: 'E1.1. throw KeyNotFoundException("Session not found.")'}
          - {d: 5, t: 4, k: ret, l: "E1.2. Return 404 ApiResponse.Fail(ex.Message)"}
          - {d: 4, t: 3, k: ret, l: "E1.3. Return 404"}
          - {d: 3, t: 2, k: ret, l: 'E1.4. Return ApiCallResult.Fail("Session not found.", 404)'}
          - {d: 2, t: 1, k: ret, l: "E1.5. 302 RedirectToAction(Index)"}
          - {d: 1, t: 0, k: ret, l: "E1.6. Interview dashboard with the error message"}
  - {d: 6, t: 5, k: ret, l: "12. Return IntegrityPolicyStatusResponse{Accepted, AcceptedAt}"}
  - {d: 5, t: 4, k: ret, l: "13. Return 200 ApiResponse.Ok(result)"}
  - {d: 4, t: 3, k: ret, l: "14. Return 200"}
  - {d: 3, t: 2, k: ret, l: "15. Return ApiCallResult.Ok(IntegrityPolicyStatusResponse, 200)"}
  - frame: opt
    sections:
      - guard: "[result.Data.Accepted == true - the policy was already accepted]"
        body:
          - {d: 2, t: 1, k: ret, l: "E2.1. 302 RedirectToAction(Room, { id })"}
          - {d: 1, t: 0, k: ret, l: "E2.2. Interview Room [see #4]"}
  - {d: 2, t: 1, k: ret, l: "16. Return 200 View IntegrityPolicy"}
  - {d: 1, t: 0, k: ret, l: "17. Show Integrity Policy page"}

  # ---------------- Phase 2: POST accept ----------------
  - {d: 0, t: 1, k: call, l: '18. Tick "I have read and understand the interview rules"'}
  - {d: 1, t: 1, k: call, l: "19. enterBtn.disabled = !checkbox.checked", self: true}
  - {d: 1, t: 0, k: ret, l: "20. Enter Interview button enabled"}
  - {d: 0, t: 1, k: call, l: "21. Click Enter Interview (form submit)"}
  - {d: 1, t: 1, k: call, l: "22. enterBtn.disabled = true", self: true}
  - {d: 1, t: 2, k: call, l: "23. POST /Interview/AcceptIntegrityPolicy?id={id}"}
  - {d: 2, t: 3, k: call, l: "24. AcceptIntegrityPolicyAsync(id, ct)"}
  - {d: 3, t: 4, k: call, l: "25. POST api/interview/sessions/{id}/integrity-policy/accept"}
  - {d: 4, t: 5, k: call, l: "26. Forward (route interview-route, no prefix strip)"}
  - {d: 5, t: 5, k: call, l: "27. Guid.Parse(User.FindFirstValue(ClaimTypes.NameIdentifier))", self: true}
  - {d: 5, t: 6, k: call, l: "28. AcceptIntegrityPolicyAsync(userId, sessionId, ct)"}
  - {d: 6, t: 7, k: call, l: "29. GetByIdAsync(sessionId, ct)"}
  - {d: 7, t: 8, k: call, l: "30. SELECT InterviewSession WHERE SessionId AND !IsDeleted"}
  - {d: 8, t: 7, k: ret, l: "31. Return session row / null"}
  - {d: 7, t: 6, k: ret, l: "32. Return InterviewSession?"}
  - frame: opt
    sections:
      - guard: "[session is null OR session.UserId != userId]"
        body:
          - {d: 6, t: 5, k: ret, l: 'F1.1. throw KeyNotFoundException("Session not found.")'}
          - {d: 5, t: 4, k: ret, l: "F1.2. Return 404 ApiResponse.Fail(ex.Message)"}
          - {d: 4, t: 3, k: ret, l: "F1.3. Return 404"}
          - {d: 3, t: 2, k: ret, l: 'F1.4. Return ApiCallResult.Fail("Session not found.", 404)'}
          - {d: 2, t: 1, k: ret, l: "F1.5. 302 RedirectToAction(Index)"}
          - {d: 1, t: 0, k: ret, l: "F1.6. Interview dashboard with the error message"}
  - frame: opt
    sections:
      - guard: '[session.Status != "Initialized"]'
        body:
          - {d: 6, t: 5, k: ret, l: "F2.1. throw InvalidOperationException"}
          - {d: 5, t: 4, k: ret, l: "F2.2. Return 400 ApiResponse.Fail(ex.Message)"}
          - {d: 4, t: 3, k: ret, l: "F2.3. Return 400"}
          - {d: 3, t: 2, k: ret, l: "F2.4. Return ApiCallResult.Fail(message, 400)"}
          - {d: 2, t: 1, k: ret, l: "F2.5. 302 RedirectToAction(Index)"}
          - {d: 1, t: 0, k: ret, l: "F2.6. Interview dashboard with the error message"}
  - {d: 6, t: 7, k: call, l: "33. AcceptIntegrityPolicyIfAsync(sessionId, ct)"}
  - {d: 7, t: 8, k: call, l: "34. UPDATE InterviewSessions SET IntegrityPolicyAccepted"}
  - {d: 8, t: 7, k: ret, l: "35. Return rows affected"}
  - {d: 7, t: 6, k: ret, l: "36. Return updated = rowsAffected > 0"}
  - frame: opt
    sections:
      - guard: "[updated == true - this request won the atomic UPDATE]"
        body:
          - {d: 6, t: 6, k: call, l: "G.1. session.IntegrityPolicyAccepted = true", self: true}
  - {d: 6, t: 5, k: ret, l: "37. Return IntegrityPolicyStatusResponse{Accepted, AcceptedAt}"}
  - {d: 5, t: 4, k: ret, l: "38. Return 200 ApiResponse.Ok(result)"}
  - {d: 4, t: 3, k: ret, l: "39. Return 200"}
  - {d: 3, t: 2, k: ret, l: "40. Return ApiCallResult.Ok(IntegrityPolicyStatusResponse, 200)"}
  - {d: 2, t: 1, k: ret, l: "41. 302 RedirectToAction(Room, { id })"}
  - {d: 1, t: 0, k: ret, l: "42. Interview Room [see #4]"}
