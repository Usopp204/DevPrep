feature: VerifyFaceEntryGate
title: Verify Face Entry Gate
uc_id: "UC-10"
uc_label: "[UC-53]"
backlog: [48]

participants:
  - name: Candidate
    kind: actor
    w: 30
  - name: ":Verify UI"
    kind: box
    w: 160
  - name: ":VerificationController\n(WebClient)"
    kind: box
    w: 210
  - name: ":VerificationService\n(WebClient)"
    kind: box
    w: 190
  - name: ":API Gateway"
    kind: box
    w: 140
  - name: ":SessionVerificationController\n(InterviewAPI)"
    kind: box
    w: 250
  - name: ":BiometricVerificationService\n(InterviewAPI)"
    kind: box
    w: 240
  - name: ":SessionRepository\n(InterviewAPI)"
    kind: box
    w: 180
  - name: ":SessionVerificationEventRepository\n(InterviewAPI)"
    kind: box
    w: 280
  - name: ":SessionVerificationChallengeRepository\n(InterviewAPI)"
    kind: box
    w: 300
  - name: ":ProfileBiometricsRepository\n(InterviewAPI)"
    kind: box
    w: 230
  - name: ":AiServiceClient\n(InterviewAPI)"
    kind: box
    w: 190
  - name: ":ai-service\n/internal/biometrics/face/verify-live"
    kind: box
    w: 400
  - name: "SQL Server"
    kind: db
    w: 70

flow:
  - {d: 0, t: 1, k: call, l: '1. Click "I''m ready"'}
  - {d: 1, t: 1, k: call, l: "2. capture(): 3s countdown, grab 8 frames", self: true}
  - {d: 1, t: 2, k: call, l: "3. POST Verification/VerifyFace (multipart)"}
  - {d: 2, t: 2, k: call, l: "4. Buffer each IFormFile into MemoryStream", self: true}
  - frame: opt
    sections:
      - guard: "[sessionId empty OR frames empty]"
        body:
          - {d: 2, t: 1, k: ret, l: '4.1. Return 400 {error: "At least one frame is required."}'}
          - {d: 1, t: 0, k: ret, l: '4.2. Show error + "Try again" (via handleFail, boundary #14)'}
  - {d: 2, t: 3, k: call, l: "5. VerifyFaceAsync(sessionId, buffered)"}
  - {d: 3, t: 4, k: call, l: "6. POST api/interview/sessions/{id}/verify/face"}
  - {d: 4, t: 5, k: call, l: "7. Forward (route interview-route, no prefix strip)"}
  - {d: 5, t: 5, k: call, l: "8. Guid.Parse(User.FindFirstValue(ClaimTypes.NameIdentifier))", self: true}
  - {d: 5, t: 6, k: call, l: "9. VerifyFaceAsync(userId, sessionId, frames, ct, \"Entry\")"}
  - {d: 6, t: 6, k: call, l: "10. EnsureEnabled()", self: true}
  - frame: opt
    sections:
      - guard: "[Biometrics:Enabled == false]"
        body:
          - {d: 6, t: 5, k: ret, l: "10.1. throw InvalidOperationException"}
          - {d: 5, t: 4, k: ret, l: "10.2. Return 400 ApiResponse.Fail(ex.Message)"}
          - {d: 4, t: 3, k: ret, l: "10.3. Return 400"}
          - {d: 3, t: 2, k: ret, l: "10.4. Return (false, null, error)"}
          - {d: 2, t: 1, k: ret, l: "10.5. Return 400 {error}"}
          - {d: 1, t: 0, k: ret, l: '10.6. Show error + "Try again" (boundary #14)'}
  - {d: 6, t: 7, k: call, l: "11. GetByIdAsync(sessionId) — via EnsureSessionOwnedAsync"}
  - {d: 7, t: 13, k: call, l: "12. SELECT InterviewSession by SessionId"}
  - {d: 13, t: 7, k: ret, l: "13. Return session row / null"}
  - {d: 7, t: 6, k: ret, l: "14. Return InterviewSession?"}
  - frame: opt
    sections:
      - guard: "[session is null OR session.UserId != userId]"
        body:
          - {d: 6, t: 5, k: ret, l: '14.1. throw KeyNotFoundException("Session not found.")'}
          - {d: 5, t: 4, k: ret, l: "14.2. Return 404 ApiResponse.Fail(ex.Message)"}
          - {d: 4, t: 3, k: ret, l: "14.3. Return 404"}
          - {d: 3, t: 2, k: ret, l: "14.4. Return (false, null, error)"}
          - {d: 2, t: 1, k: ret, l: "14.5. Return 400 {error} (WebClient always collapses to 400)"}
          - {d: 1, t: 0, k: ret, l: '14.6. Show error + "Try again" (boundary #14)'}
  - {d: 6, t: 8, k: call, l: "15. ListBySessionAsync(sessionId, \"Entry\")"}
  - {d: 8, t: 13, k: call, l: "16. SELECT SessionVerificationEvents WHERE Phase=\"Entry\""}
  - {d: 13, t: 8, k: ret, l: "17. Return event list"}
  - {d: 8, t: 6, k: ret, l: "18. Return List<SessionVerificationEvent>"}
  - {d: 6, t: 6, k: call, l: "19. Count failedAttempts (Modality=Face AND Decision!=Pass)", self: true}
  - frame: opt
    sections:
      - guard: "[phase==\"Entry\" AND failedAttempts >= EntryMaxRetries (default 3)]"
        body:
          - {d: 6, t: 5, k: ret, l: "19.1. throw InvalidOperationException"}
          - {d: 5, t: 4, k: ret, l: "19.2. Return 400 ApiResponse.Fail(ex.Message)"}
          - {d: 4, t: 3, k: ret, l: "19.3. Return 400"}
          - {d: 3, t: 2, k: ret, l: "19.4. Return (false, null, error)"}
          - {d: 2, t: 1, k: ret, l: "19.5. Return 400 {error}"}
          - {d: 1, t: 0, k: ret, l: '19.6. Show error + "Try again" (boundary #14)'}
  - {d: 6, t: 9, k: call, l: "20. GetActiveAsync(sessionId, \"Face\", now)"}
  - {d: 9, t: 13, k: call, l: "21. SELECT SessionVerificationChallenge WHERE Modality=\"Face\""}
  - {d: 13, t: 9, k: ret, l: "22. Return challenge row / null"}
  - {d: 9, t: 6, k: ret, l: "23. Return SessionVerificationChallenge?"}
  - frame: opt
    sections:
      - guard: "[challenge is null]"
        body:
          - {d: 6, t: 5, k: ret, l: '23.1. throw InvalidOperationException("No active challenge...")'}
          - {d: 5, t: 4, k: ret, l: "23.2. Return 400 ApiResponse.Fail(ex.Message)"}
          - {d: 4, t: 3, k: ret, l: "23.3. Return 400"}
          - {d: 3, t: 2, k: ret, l: "23.4. Return (false, null, error)"}
          - {d: 2, t: 1, k: ret, l: "23.5. Return 400 {error}"}
          - {d: 1, t: 0, k: ret, l: '23.6. Show error + "Try again" (boundary #14)'}
  - {d: 6, t: 9, k: call, l: "24. ConsumedAt = now + SaveChangesAsync()"}
  - {d: 9, t: 13, k: call, l: "25. UPDATE SessionVerificationChallenge SET ConsumedAt"}
  - {d: 13, t: 9, k: ret, l: "26. Return"}
  - {d: 9, t: 6, k: ret, l: "26.1. Return"}
  - {d: 6, t: 10, k: call, l: '27. GetAsync(userId, "Face") — via GetStoredEmbeddingAsync'}
  - {d: 10, t: 13, k: call, l: '28. SELECT ProfileBiometric WHERE UserId AND Modality="Face"'}
  - {d: 13, t: 10, k: ret, l: "29. Return row / null"}
  - {d: 10, t: 6, k: ret, l: "30. Return ProfileBiometric?"}
  - frame: opt
    sections:
      - guard: "[row is null]"
        body:
          - {d: 6, t: 5, k: ret, l: "30.1. throw InvalidOperationException"}
          - {d: 5, t: 4, k: ret, l: "30.2. Return 400 ApiResponse.Fail(ex.Message)"}
          - {d: 4, t: 3, k: ret, l: "30.3. Return 400"}
          - {d: 3, t: 2, k: ret, l: "30.4. Return (false, null, error)"}
          - {d: 2, t: 1, k: ret, l: "30.5. Return 400 {error}"}
          - {d: 1, t: 0, k: ret, l: '30.6. Show error + "Try again" (boundary #14)'}
  - {d: 6, t: 11, k: call, l: "31. VerifyFaceLiveAsync(frames, embedding, challengeJson)"}
  - {d: 11, t: 12, k: call, l: "32. POST /internal/biometrics/face/verify-live"}
  - frame: alt
    sections:
      - guard: "[ai-service returns 422 quality/multi-face error]"
        body:
          - {d: 12, t: 11, k: ret, l: "A.1. Return 422 {detail}"}
          - {d: 11, t: 6, k: ret, l: "A.2. throw BiometricQualityException(detail)"}
          - {d: 6, t: 5, k: ret, l: "A.3. (exception propagates up, not caught inside VerifyFaceAsync)"}
          - {d: 5, t: 4, k: ret, l: "A.4. Return 422 ApiResponse.Fail(ex.Message)"}
          - {d: 4, t: 3, k: ret, l: "A.5. Return 422"}
          - {d: 3, t: 2, k: ret, l: 'A.6. Return (false, null, "Verification failed (422): ...")'}
          - {d: 2, t: 1, k: ret, l: "A.7. Return 400 {error}"}
          - {d: 1, t: 0, k: ret, l: "A.8. catch in capture() -> handleFail(err.message) (boundary #14)"}
      - guard: "[ai-service returns 200, frame valid]"
        body:
          - {d: 12, t: 11, k: ret, l: "33. Return 200 FaceVerifyLiveResponse"}
          - {d: 11, t: 6, k: ret, l: "34. Return AiFaceVerifyLiveResponse"}
          - {d: 6, t: 6, k: call, l: "35. Build VerificationResultResponse", self: true}
          - {d: 6, t: 8, k: call, l: "36. AddAsync(SessionVerificationEvent)"}
          - {d: 8, t: 13, k: call, l: "37. INSERT SessionVerificationEvent"}
          - {d: 13, t: 8, k: ret, l: "38. Return"}
          - {d: 8, t: 6, k: ret, l: "39. Return"}
          - {d: 6, t: 5, k: ret, l: "40. Return VerificationResultResponse"}
          - {d: 5, t: 4, k: ret, l: "41. Return 200 ApiResponse.Ok(result)"}
          - {d: 4, t: 3, k: ret, l: "42. Return 200"}
          - {d: 3, t: 2, k: ret, l: "43. Return (true, result, null)"}
          - {d: 2, t: 1, k: ret, l: "44. Return 200 JSON {passed, score, live, reason}"}
          - {d: 1, t: 1, k: call, l: "B.1. Check result.passed", self: true}
          - frame: alt
            sections:
              - guard: "[result.passed == true]"
                body:
                  - {d: 1, t: 0, k: ret, l: "B.2. Overlay \"Identity Verified\" [see #11]"}
              - guard: "[result.passed == false]"
                body:
                  - {d: 1, t: 0, k: ret, l: "B.3. handleFail(result.reason) [see #14]"}
