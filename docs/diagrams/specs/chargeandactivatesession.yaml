feature: ChargeAndActivateSession
title: Charge And Activate Session
uc_id: "UC-43"
uc_label: "[UC-43]"
backlog: [54]

participants:
  - name: Candidate
    kind: actor
    w: 30
  - name: ":Interview Room UI"
    kind: box
    w: 180
  - name: ":InterviewController\n(WebClient)"
    kind: box
    w: 200
  - name: ":InterviewService\n(WebClient)"
    kind: box
    w: 190
  - name: ":API Gateway"
    kind: box
    w: 140
  - name: ":InterviewSessionController\n(InterviewAPI)"
    kind: box
    w: 250
  - name: ":SessionService\n(InterviewAPI)"
    kind: box
    w: 190
  - name: ":SessionRepository\n(InterviewAPI)"
    kind: box
    w: 200
  - name: ":SessionVerificationEventRepository\n(InterviewAPI)"
    kind: box
    w: 280
  - name: ":PaymentApiClient\n(InterviewAPI)"
    kind: box
    w: 200
  - name: ":PaymentAPI (:7008)"
    kind: box
    w: 170
  - name: "SQL Server"
    kind: db
    w: 70

flow:
  # ---------------- Phase 1: reach the endpoint ----------------
  - {d: 0, t: 1, k: call, l: "1. Room entry guards passed [see #19]"}
  - {d: 1, t: 2, k: call, l: "2. GET /Interview/Room/{id}"}
  - {d: 2, t: 3, k: call, l: "3. GenerateQuestionAsync(id, ct)"}
  - {d: 3, t: 4, k: call, l: "4. POST api/interview/sessions/{id}/questions/generate"}
  - {d: 4, t: 5, k: call, l: "5. Forward (route interview-route, no prefix strip)"}
  - {d: 5, t: 5, k: call, l: "6. Guid.Parse(User.FindFirstValue(NameIdentifier))", self: true}
  - {d: 5, t: 6, k: call, l: "7. GenerateQuestionAsync(userId, sessionId, ct)"}

  # ---------------- Phase 2: the three server-side guards (Step A / A.1 / A.2) -------------
  - {d: 6, t: 7, k: call, l: "8. GetWithQuestionsAsync(sessionId, ct)"}
  - {d: 7, t: 11, k: call, l: "9. SELECT InterviewSession + SessionQuestions"}
  - {d: 11, t: 7, k: ret, l: "10. Return the session graph / null"}
  - {d: 7, t: 6, k: ret, l: "11. Return InterviewSession?"}
  - frame: opt
    sections:
      - guard: '[session is null OR not owned OR Status not in ("Initialized","InProgress")]'
        body:
          - {d: 6, t: 5, k: ret, l: "A.1. throw InvalidOperationException"}
          - {d: 5, t: 4, k: ret, l: "A.2. Return 503 ApiResponse.Fail(generic message)"}
          - {d: 4, t: 3, k: ret, l: "A.3. Return 503"}
          - {d: 3, t: 2, k: ret, l: "A.4. Return (false, error)"}
          - {d: 2, t: 1, k: ret, l: 'A.5. TempData["ErrorMessage"]; 302 RedirectToAction(Index)'}
          - {d: 1, t: 0, k: ret, l: "A.6. Interview dashboard with the error banner"}
  - {d: 6, t: 8, k: call, l: '12. ListBySessionAsync(sessionId, "Entry", ct) [see #14]'}
  - {d: 8, t: 11, k: call, l: '13. SELECT SessionVerificationEvents WHERE Phase="Entry"'}
  - {d: 11, t: 8, k: ret, l: "14. Return event rows"}
  - {d: 8, t: 6, k: ret, l: "15. Return List<SessionVerificationEvent>"}
  - frame: opt
    sections:
      - guard: '[no Entry event with Modality="Face" and Decision="Pass"]'
        body:
          - {d: 6, t: 5, k: ret, l: "B.1. throw InvalidOperationException"}
          - {d: 5, t: 4, k: ret, l: "B.2. Return 503 ApiResponse.Fail(generic message)"}
          - {d: 4, t: 3, k: ret, l: "B.3. Return 503"}
          - {d: 3, t: 2, k: ret, l: "B.4. Return (false, error)"}
          - {d: 2, t: 1, k: ret, l: 'B.5. TempData["ErrorMessage"]; 302 RedirectToAction(Index)'}
          - {d: 1, t: 0, k: ret, l: "B.6. Interview dashboard with the error banner"}
  - {d: 6, t: 6, k: call, l: "16. RequireIntegrityPolicyAccepted(session)", self: true}
  - frame: opt
    sections:
      - guard: "[!session.IntegrityPolicyAccepted]"
        body:
          - {d: 6, t: 5, k: ret, l: "C.1. throw SessionGuardException(403)"}
          - {d: 5, t: 4, k: ret, l: "C.2. Return 403 {error, message}"}
          - {d: 4, t: 3, k: ret, l: "C.3. Return 403"}
          - {d: 3, t: 2, k: ret, l: "C.4. Return (false, error)"}
          - {d: 2, t: 1, k: ret, l: 'C.5. TempData["ErrorMessage"]; 302 RedirectToAction(Index)'}
          - {d: 1, t: 0, k: ret, l: "C.6. Interview dashboard with the error banner"}

  # ---------------- Phase 3: pick the question, stamp AskedAt (Step B / C) ----------------
  - {d: 6, t: 11, k: call, l: '17. SELECT EXISTS ChatMessages WHERE MessageType="Answer"'}
  - {d: 11, t: 6, k: ret, l: "18. Return the first unanswered SessionQuestion"}
  - frame: opt
    sections:
      - guard: "[every planned question already answered - nextQuestion is null]"
        body:
          - {d: 6, t: 5, k: ret, l: "D.1. Return GenerateQuestionResponse{Ended=true}"}
          - {d: 5, t: 4, k: ret, l: "D.2. Return 200 ApiResponse.Ok(result)"}
          - {d: 4, t: 3, k: ret, l: "D.3. Return 200"}
          - {d: 3, t: 2, k: ret, l: "D.4. Return (true, null)"}
          - {d: 2, t: 1, k: ret, l: "D.5. View Room without a further question"}
          - {d: 1, t: 0, k: ret, l: "D.6. Room shows the interview is finished"}
  - frame: opt
    sections:
      - guard: "[nextQuestion.AskedAt is null - first serve of this question]"
        body:
          - {d: 6, t: 7, k: call, l: "E.1. SaveChangesAsync(ct) after AskedAt = now"}
          - {d: 7, t: 11, k: call, l: "E.2. UPDATE SessionQuestions SET AskedAt"}
          - {d: 11, t: 7, k: ret, l: "E.3. Return rows affected"}
          - {d: 7, t: 6, k: ret, l: "E.4. Return"}

  # ---------------- Phase 4: atomic activation + the one-time charge (Step D / D.1) --------
  - {d: 6, t: 7, k: call, l: '19. UpdateStatusIfAsync(..., "Initialized", "InProgress")'}
  - {d: 7, t: 11, k: call, l: '20. UPDATE InterviewSessions SET Status="InProgress"'}
  - {d: 11, t: 7, k: ret, l: "21. Return rows affected"}
  - {d: 7, t: 6, k: ret, l: "22. Return statusChanged (rowsAffected > 0)"}
  - frame: opt
    sections:
      - guard: "[isFirstEntry AND statusChanged - the one-time activation]"
        body:
          - {d: 6, t: 6, k: call, l: "F.1. creditCost = CreditConfig.GetCreditCost(minutes)", self: true}
          - {d: 6, t: 9, k: call, l: "F.2. DeductCreditAsync(userId, creditCost, sessionId, ...)"}
          - {d: 9, t: 10, k: call, l: "F.3. POST /api/internal/credit/deduct"}
          - {d: 10, t: 9, k: ret, l: "F.4. Return 200 CreditDeductionResponse / non-2xx"}
          - {d: 9, t: 6, k: ret, l: "F.5. Return CreditDeductionResponse"}
          - frame: opt
            sections:
              - guard: "[!deductResult.Success - refused, or PaymentAPI unreachable]"
                body:
                  - {d: 6, t: 7, k: call, l: 'G.1. UpdateStatusIfAsync(..., "InProgress", "Initialized")'}
                  - {d: 7, t: 11, k: call, l: 'G.2. UPDATE InterviewSessions SET Status="Initialized"'}
                  - {d: 11, t: 7, k: ret, l: "G.3. Return rows affected"}
                  - {d: 7, t: 6, k: ret, l: "G.4. Return"}
                  - frame: opt
                    sections:
                      - guard: "[!deductResult.ServiceAvailable - PaymentAPI never answered]"
                        body:
                          - {d: 6, t: 5, k: ret, l: "H.1. throw CreditServiceUnavailableException"}
                          - {d: 5, t: 4, k: ret, l: "H.2. Return 503 ApiResponse.Fail(payment unavailable)"}
                          - {d: 4, t: 3, k: ret, l: "H.3. Return 503"}
                          - {d: 3, t: 2, k: ret, l: "H.4. Return (false, error)"}
                          - {d: 2, t: 1, k: ret, l: 'H.5. TempData["ErrorMessage"]; 302 RedirectToAction(Index)'}
                          - {d: 1, t: 0, k: ret, l: "H.6. Interview dashboard with the error banner"}
                  - {d: 6, t: 5, k: ret, l: "G.5. throw InvalidOperationException"}
                  - {d: 5, t: 4, k: ret, l: "G.6. Return 503 ApiResponse.Fail(generic message)"}
                  - {d: 4, t: 3, k: ret, l: "G.7. Return 503"}
                  - {d: 3, t: 2, k: ret, l: "G.8. Return (false, error)"}
                  - {d: 2, t: 1, k: ret, l: 'G.9. TempData["ErrorMessage"]; 302 RedirectToAction(Index)'}
                  - {d: 1, t: 0, k: ret, l: "G.10. Interview dashboard with the error banner"}
          - {d: 6, t: 7, k: call, l: "F.6. GetByIdAsync(sessionId, ct)"}
          - {d: 7, t: 11, k: call, l: "F.7. SELECT InterviewSession by SessionId"}
          - {d: 11, t: 7, k: ret, l: "F.8. Return session row / null"}
          - {d: 7, t: 6, k: ret, l: "F.9. Return InterviewSession?"}
          - {d: 6, t: 7, k: call, l: "F.10. SaveChangesAsync after CreditCost and StartedAt = now"}
          - {d: 7, t: 11, k: call, l: "F.11. UPDATE InterviewSessions SET CreditCost, StartedAt"}
          - {d: 11, t: 7, k: ret, l: "F.12. Return rows affected"}
          - {d: 7, t: 6, k: ret, l: "F.13. Return"}

  # ---------------- Phase 5: serve the question, refund if the insert fails (Step E / F) ---
  - {d: 6, t: 11, k: call, l: '23. SELECT EXISTS ChatMessages WHERE MessageType="Question"'}
  - {d: 11, t: 6, k: ret, l: "24. Return alreadyAsked"}
  - frame: opt
    sections:
      - guard: "[!alreadyAsked - no AI Question message for this SessionQuestion]"
        body:
          - {d: 6, t: 7, k: call, l: 'J.1. AddChatMessageAsync(ChatMessage{SenderType="AI"})'}
          - {d: 7, t: 11, k: call, l: "J.2. INSERT ChatMessage (SaveChangesAsync)"}
          - {d: 11, t: 7, k: ret, l: "J.3. Return rows affected"}
          - {d: 7, t: 6, k: ret, l: "J.4. Return ChatMessage"}
  - frame: opt
    sections:
      - guard: "[the insert threw AND credit was deducted on this same call]"
        body:
          - {d: 6, t: 9, k: call, l: "K.1. RefundCreditAsync(userId, creditCost, sessionId, ...)"}
          - {d: 9, t: 10, k: call, l: "K.2. POST /api/internal/credit/refund"}
          - {d: 10, t: 9, k: ret, l: "K.3. Return 200 CreditDeductionResponse / non-2xx"}
          - {d: 9, t: 6, k: ret, l: "K.4. Return CreditDeductionResponse"}
          - {d: 6, t: 5, k: ret, l: "K.5. rethrow the original exception"}
          - {d: 5, t: 4, k: ret, l: "K.6. Return 503 ApiResponse.Fail(generic message)"}
          - {d: 4, t: 3, k: ret, l: "K.7. Return 503"}
          - {d: 3, t: 2, k: ret, l: "K.8. Return (false, error)"}
          - {d: 2, t: 1, k: ret, l: 'K.9. TempData["ErrorMessage"]; 302 RedirectToAction(Index)'}
          - {d: 1, t: 0, k: ret, l: "K.10. Interview dashboard with the error banner"}
  - {d: 6, t: 6, k: call, l: "25. GetIdleThresholds(null); compute elapsedSeconds", self: true}
  - {d: 6, t: 5, k: ret, l: "26. Return GenerateQuestionResponse"}
  - {d: 5, t: 4, k: ret, l: "27. Return 200 ApiResponse.Ok(result)"}
  - {d: 4, t: 3, k: ret, l: "28. Return 200"}
  - {d: 3, t: 2, k: ret, l: "29. Return (true, null)"}
  - {d: 2, t: 1, k: ret, l: "30. View Room with the current question [see #19]"}
  - {d: 1, t: 0, k: ret, l: "31. Room shows the question, countdown and camera"}
