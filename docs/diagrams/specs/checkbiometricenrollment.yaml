feature: CheckBiometricEnrollment
title: Check Biometric Enrollment
uc_id: "UC-52"
uc_label: "[UC-52]"
backlog: [12]

participants:
  - name: Candidate
    kind: actor
    w: 30
  - name: ":Profile Identity UI"
    kind: box
    w: 190
  - name: ":Interview Dashboard UI"
    kind: box
    w: 210
  - name: ":ProfileController\n(WebClient)"
    kind: box
    w: 200
  - name: ":InterviewController\n(WebClient)"
    kind: box
    w: 200
  - name: ":BiometricsService\n(WebClient)"
    kind: box
    w: 190
  - name: ":API Gateway"
    kind: box
    w: 140
  - name: ":ProfileBiometricsController\n(InterviewAPI)"
    kind: box
    w: 260
  - name: ":ProfileBiometricsService\n(InterviewAPI)"
    kind: box
    w: 240
  - name: ":ProfileBiometricsRepository\n(InterviewAPI)"
    kind: box
    w: 250
  - name: "SQL Server"
    kind: db
    w: 70

flow:
  # ---------------- Branch A: the Identity screen (read-only status view) ----------------
  - {d: 0, t: 1, k: call, l: "1. Open Profile > Identity verification"}
  - {d: 1, t: 3, k: call, l: "2. GET /Profile/Identity"}
  - {d: 3, t: 5, k: call, l: "3. GetStatusAsync(ct)"}
  - {d: 5, t: 6, k: call, l: "4. GET api/profiles/me/biometrics"}
  - {d: 6, t: 7, k: call, l: "5. Forward (route profiles-biometrics-root-route)"}
  - {d: 7, t: 7, k: call, l: "6. Guid.Parse(User.FindFirstValue(NameIdentifier))", self: true}
  - {d: 7, t: 8, k: call, l: "7. GetStatusAsync(userId, ct)"}
  - {d: 8, t: 9, k: call, l: "8. ListByUserAsync(userId, ct)"}
  - {d: 9, t: 10, k: call, l: "9. SELECT ProfileBiometrics WHERE UserId"}
  - {d: 10, t: 9, k: ret, l: "10. Return rows"}
  - {d: 9, t: 8, k: ret, l: "11. Return List<ProfileBiometric>"}
  - {d: 8, t: 8, k: call, l: "12. face/voice = rows.FirstOrDefault(b => b.Modality)", self: true}
  - frame: alt
    sections:
      - guard: "[the status read succeeded]"
        body:
          - {d: 8, t: 7, k: ret, l: "A.1. Return BiometricStatusResponse"}
          - {d: 7, t: 6, k: ret, l: "A.2. Return 200 ApiResponse.Ok(result)"}
          - {d: 6, t: 5, k: ret, l: "A.3. Return 200"}
          - {d: 5, t: 3, k: ret, l: "A.4. Return (true, BiometricStatusModel, null)"}
          - {d: 3, t: 3, k: call, l: "A.5. Status = status ?? new BiometricStatusModel()", self: true}
          - {d: 3, t: 1, k: ret, l: "A.6. View Identity(BiometricsViewModel{Status})"}
          - {d: 1, t: 0, k: ret, l: "A.7. Identity page shows Face/Voice enrolment state"}
      - guard: "[GetStatusAsync throws - caught by the controller]"
        body:
          - {d: 8, t: 7, k: ret, l: "A.8. throw Exception"}
          - {d: 7, t: 6, k: ret, l: "A.9. Return 503 ApiResponse.Fail(generic message)"}
          - {d: 6, t: 5, k: ret, l: "A.10. Return 503"}
          - {d: 5, t: 3, k: ret, l: "A.11. Return (false, null, error)"}
          - {d: 3, t: 3, k: call, l: "A.12. Status = status ?? new BiometricStatusModel()", self: true}
          - {d: 3, t: 1, k: ret, l: "A.13. View Identity(BiometricsViewModel{ErrorMessage})"}
          - {d: 1, t: 0, k: ret, l: "A.14. Identity page with an error banner"}

  # ---------------- Branch B: the enrollment gate on Start ----------------
  # The InterviewAPI tail is identical to messages 5-12 above (same endpoint, same service,
  # same repository, same query) - collapsed into one call + return, as ValidateEntryGateStatus
  # does for its own re-poll branch. See FLOWS/CheckBiometricEnrollment.md.
  - {d: 0, t: 2, k: call, l: "13. Submit the interview configuration form"}
  - {d: 2, t: 4, k: call, l: "14. POST /Interview/Start"}
  - {d: 4, t: 5, k: call, l: "15. GetStatusAsync(ct)"}
  - {d: 5, t: 6, k: call, l: "16. GET api/profiles/me/biometrics"}
  - {d: 6, t: 5, k: ret, l: "17. Return 200 BiometricStatusResponse"}
  - {d: 5, t: 4, k: ret, l: "18. Return (statusOk, BiometricStatusModel, error)"}
  - frame: alt
    sections:
      - guard: "[statusOk AND FaceEnrolled - the gate opens]"
        body:
          - {d: 4, t: 4, k: call, l: "B.1. StartInterviewAsync(...) [see #3]", self: true}
          - {d: 4, t: 2, k: ret, l: "B.2. 302 RedirectToAction(Verify, { id })"}
          - {d: 2, t: 0, k: ret, l: "B.3. Biometric entry-gate screen [see #13]"}
      - guard: "[statusOk AND !FaceEnrolled - the gate closes]"
        body:
          - {d: 4, t: 2, k: ret, l: 'B.4. TempData["InfoMessage"]; 302 to Profile/Identity'}
          - {d: 2, t: 0, k: ret, l: "B.5. Redirected to enroll a face first [see #1]"}
      - guard: "[!statusOk - the lookup failed, the gate fails open]"
        body:
          - {d: 4, t: 4, k: call, l: "B.6. StartInterviewAsync(...) [see #3]", self: true}
          - {d: 4, t: 2, k: ret, l: "B.7. 302 RedirectToAction(Verify, { id })"}
          - {d: 2, t: 0, k: ret, l: "B.8. InitAsync re-checks the gate server-side [see #4]"}
