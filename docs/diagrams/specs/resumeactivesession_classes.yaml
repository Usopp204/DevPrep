include:
  - file: Controller.yaml
    column: 0
  - file: ControllerBase.yaml
    column: 2
  - file: ApiResponse.yaml
    name: "ApiResponse<T> (InterviewAPI)"
    column: 3
  - file: InterviewDbContext.yaml
    column: 4
  - file: DbContext.yaml
    column: 4
  - file: InterviewSession.yaml
    column: 5
  - file: InterviewRoom.yaml
    column: 5
  - file: ChatMessage.yaml
    column: 5

classes:
  # ---------- column 0: WebClient controller + service ----------
  - name: "InterviewController (WebClient)"
    column: 0
    w: 380
    fields:
      - "- interviewService: IInterviewService"
      - "- biometricsService: IBiometricsService"
      - "- paymentService: IPaymentService"
    methods:
      - "+ Index(ct: CancellationToken): Task<IActionResult>"
      - "+ Start(model: DashboardViewModel, ct: CancellationToken): Task<IActionResult>"
      - "- BuildDashboardAsync(ct: CancellationToken): Task<DashboardViewModel>"

  - name: "IInterviewService (WebClient)"
    column: 0
    w: 400
    fields: []
    methods:
      - "+ GetActiveSessionAsync(ct: CancellationToken): Task<ApiCallResult<ActiveSessionResponse>>"
      - "+ StartInterviewAsync(durationMinutes: int, level: string, position: string, jd: string?, jdId: Guid?, focusAreas: List<string>, ct: CancellationToken): Task<StartInterviewResult>"

  - name: "InterviewService (WebClient)"
    column: 0
    w: 400
    fields:
      - "- apiClient: IApiClient"
    methods:
      - "+ GetActiveSessionAsync(ct: CancellationToken): Task<ApiCallResult<ActiveSessionResponse>>"
      - "+ StartInterviewAsync(durationMinutes: int, level: string, position: string, jd: string?, jdId: Guid?, focusAreas: List<string>, ct: CancellationToken): Task<StartInterviewResult>"
      - "- ParseErrorBody(raw: string): (string? ErrorCode, string? Message)"

  # ---------- column 1: WebClient view models ----------
  - name: DashboardViewModel
    column: 1
    w: 320
    fields:
      - "+ DurationMinutes: int"
      - "+ Level: string"
      - "+ Position: string"
      - "+ CreditBalance: int?"
      - "+ ActiveSession: ActiveSessionResponse?"
      - "+ ErrorMessage: string?"
    methods: []

  - name: "ActiveSessionResponse (WebClient)"
    column: 1
    w: 320
    fields:
      - "+ SessionId: Guid"
      - "+ Status: string"
      - "+ StartedAt: DateTime?"
      - "+ DurationMinutes: int"
      - "+ RemainingSeconds: int"
    methods: []

  - name: StartInterviewResult
    column: 1
    w: 340
    fields:
      - "+ Success: bool"
      - "+ ErrorMessage: string?"
      - "+ SessionId: Guid"
      - "+ ActiveSessionId: Guid?"
    methods:
      - "+ Failure(message: string): StartInterviewResult"
      - "+ ActiveSessionConflict(activeSessionId: Guid): StartInterviewResult"
      - "+ Ok(sessionId: Guid): StartInterviewResult"

  # ---------- column 2: InterviewAPI controller + service ----------
  - name: "InterviewSessionController (InterviewAPI)"
    column: 2
    w: 400
    fields:
      - "- _service: ISessionService"
      - "- _logger: ILogger<InterviewSessionController>"
    methods:
      - "+ GetActiveSession(ct: CancellationToken): Task<IActionResult>"
      - "+ ConfigDuration(req: ConfigDurationRequest, ct: CancellationToken): Task<IActionResult>"

  - name: ISessionService
    column: 2
    w: 420
    fields: []
    methods:
      - "+ GetActiveSessionAsync(userId: Guid, ct: CancellationToken): Task<ActiveSessionResponse?>"
      - "+ ConfigDurationAsync(userId: Guid, req: ConfigDurationRequest, ct: CancellationToken): Task<ConfigResponse>"

  - name: "SessionService (InterviewAPI)"
    column: 2
    w: 420
    fields:
      - "- _repo: ISessionRepository"
      - "- _db: InterviewDbContext"
      - "- _logger: ILogger<SessionService>"
      - "- MaxTotalPausedSeconds: int"
    methods:
      - "+ GetActiveSessionAsync(userId: Guid, ct: CancellationToken): Task<ActiveSessionResponse?>"
      - "+ ConfigDurationAsync(userId: Guid, req: ConfigDurationRequest, ct: CancellationToken): Task<ConfigResponse>"
      - "- ResolveSessionAsync(sessionId: Guid?, userId: Guid, ct: CancellationToken, factory: Func<InterviewSession>): Task<InterviewSession>"
      - "- AutoResumeIfPauseExpiredAsync(session: InterviewSession, ct: CancellationToken): Task"
      - "- FinalizeIfTimeExpiredAsync(session: InterviewSession, ct: CancellationToken): Task<bool>"
      - "- GetEffectivePausedSeconds(session: InterviewSession): int"

  # ---------- column 3: DTOs + guard exception ----------
  - name: "ActiveSessionResponse (InterviewAPI)"
    column: 3
    w: 320
    fields:
      - "+ SessionId: Guid"
      - "+ Status: string"
      - "+ StartedAt: DateTime?"
      - "+ DurationMinutes: int"
      - "+ RemainingSeconds: int"
    methods: []

  - name: SessionGuardException
    column: 3
    w: 340
    fields:
      - "+ StatusCode: int"
      - "+ ErrorCode: string"
      - "+ RetryAfterSeconds: int?"
      - "+ ActiveSessionId: Guid?"
    methods: []

  - name: InvalidOperationException
    column: 3
    fields: []
    methods: []

  # ---------- column 4: repository + DbContext ----------
  - name: ISessionRepository
    column: 4
    w: 440
    fields: []
    methods:
      - "+ GetActiveSessionAsync(userId: Guid, ct: CancellationToken): Task<InterviewSession?>"
      - "+ TryAutoResumeExpiredPauseAsync(sessionId: Guid, expectedPausedAt: DateTime, newTotalPausedSeconds: int, ct: CancellationToken): Task<bool>"
      - "+ HasSubstantiveAnswerAsync(sessionId: Guid, ct: CancellationToken): Task<bool>"
      - "+ GetRoomBySessionAsync(sessionId: Guid, ct: CancellationToken): Task<InterviewRoom?>"
      - "+ UpdateRoomAsync(room: InterviewRoom, ct: CancellationToken): Task"
      - "+ CreateAsync(session: InterviewSession, ct: CancellationToken): Task<InterviewSession>"
      - "+ SaveChangesAsync(ct: CancellationToken): Task"

  - name: "SessionRepository (InterviewAPI)"
    column: 4
    w: 440
    fields:
      - "- _db: InterviewDbContext"
      - "- _logger: ILogger<SessionRepository>"
    methods:
      - "+ GetActiveSessionAsync(userId: Guid, ct: CancellationToken): Task<InterviewSession?>"
      - "+ TryAutoResumeExpiredPauseAsync(sessionId: Guid, expectedPausedAt: DateTime, newTotalPausedSeconds: int, ct: CancellationToken): Task<bool>"
      - "+ HasSubstantiveAnswerAsync(sessionId: Guid, ct: CancellationToken): Task<bool>"
      - "+ GetRoomBySessionAsync(sessionId: Guid, ct: CancellationToken): Task<InterviewRoom?>"
      - "+ UpdateRoomAsync(room: InterviewRoom, ct: CancellationToken): Task"
      - "+ CreateAsync(session: InterviewSession, ct: CancellationToken): Task<InterviewSession>"
      - "+ SaveChangesAsync(ct: CancellationToken): Task"

relations:
  - {from: "InterviewController (WebClient)", to: Controller, type: extends}
  - {from: "InterviewController (WebClient)", to: "IInterviewService (WebClient)", type: use, label: Use}
  - {from: "InterviewController (WebClient)", to: DashboardViewModel, type: use, label: Use}
  - {from: "InterviewService (WebClient)", to: "IInterviewService (WebClient)", type: implements}
  - {from: "InterviewService (WebClient)", to: StartInterviewResult, type: use, label: Use}
  - {from: DashboardViewModel, to: "ActiveSessionResponse (WebClient)", type: composition, label: "0..1"}
  - {from: "InterviewSessionController (InterviewAPI)", to: ControllerBase, type: extends}
  - {from: "InterviewSessionController (InterviewAPI)", to: ISessionService, type: use, label: Use}
  - {from: "InterviewSessionController (InterviewAPI)", to: "ApiResponse<T> (InterviewAPI)", type: use, label: Use}
  - {from: "InterviewSessionController (InterviewAPI)", to: SessionGuardException, type: use, label: catch}
  - {from: "SessionService (InterviewAPI)", to: ISessionService, type: implements}
  - {from: "SessionService (InterviewAPI)", to: ISessionRepository, type: use, label: Use}
  - {from: "SessionService (InterviewAPI)", to: "ActiveSessionResponse (InterviewAPI)", type: use, label: Use}
  - {from: "SessionService (InterviewAPI)", to: SessionGuardException, type: use, label: throw}
  - {from: SessionGuardException, to: InvalidOperationException, type: extends}
  - {from: "SessionRepository (InterviewAPI)", to: ISessionRepository, type: implements}
  - {from: "SessionRepository (InterviewAPI)", to: InterviewDbContext, type: composition}
  - {from: InterviewDbContext, to: DbContext, type: extends}
  - {from: InterviewDbContext, to: InterviewSession, type: composition, label: "1..*"}
  - {from: InterviewDbContext, to: InterviewRoom, type: composition, label: "1..*"}
  - {from: InterviewDbContext, to: ChatMessage, type: composition, label: "1..*"}
