feature: EnrollFaceBiometric
title: Enroll Face Biometric
uc_id: ""
uc_label: "[UC-50]"
backlog: [11, 12, 53]

participants:
  - name: Candidate
    kind: actor
    w: 30
  - name: ":Biometric Wizard UI"
    kind: box
    w: 190
  - name: ":ProfileController\n(WebClient)"
    kind: box
    w: 190
  - name: ":BiometricsService\n(WebClient)"
    kind: box
    w: 190
  - name: ":API Gateway"
    kind: box
    w: 140
  - name: ":ProfileBiometricsController\n(InterviewAPI)"
    kind: box
    w: 250
  - name: ":ProfileBiometricsService\n(InterviewAPI)"
    kind: box
    w: 240
  - name: ":ProfileBiometricsRepository\n(InterviewAPI)"
    kind: box
    w: 250
  - name: ":AiServiceClient\n(InterviewAPI)"
    kind: box
    w: 190
  - name: ":ai-service\n/internal/biometrics/face/embed"
    kind: box
    w: 320
  - name: ":PaymentApiClient\n(InterviewAPI)"
    kind: box
    w: 200
  - name: ":PaymentAPI (:7008)"
    kind: box
    w: 170
  - name: "SQL Server"
    kind: db
    w: 70

flow:
  # ---------------- Phase 0: load the Identity page, read enrollment status (BL#12) -------------
  # The status read (controller -> service -> repository -> SQL, and its 503 branch) is drawn in
  # #22 CheckBiometricEnrollment. Collapsed here to one call + return: this file is about
  # ENROLLING, and the page load only has to establish what the wizard starts from.
  # Message numbers 7-17 are intentionally unused so Phase 1 keeps its original numbering.
  - {d: 0, t: 1, k: call, l: "1. Open Profile > Identity verification"}
  - {d: 1, t: 2, k: call, l: "2. GET /Profile/Identity"}
  - {d: 2, t: 3, k: call, l: "3. GetStatusAsync(ct) [see #22]"}
  - {d: 3, t: 2, k: ret, l: "4. Return (Success, BiometricStatusModel, Error)"}
  - {d: 2, t: 1, k: ret, l: "5. View Identity(BiometricsViewModel{Status})"}
  - {d: 1, t: 0, k: ret, l: "6. Identity page shows Face/Voice enrolment state"}

  # ---------------- Phase 1: wizard - permissions, capture, enroll (BL#11), bonus (BL#53) -------
  - {d: 0, t: 1, k: call, l: "18. Click Grant camera & microphone access"}
  - {d: 1, t: 1, k: call, l: "19. getUserMedia({video, audio}) probe; applyPermState()", self: true}
  - {d: 1, t: 0, k: ret, l: "20. Update permission pills; Start stays disabled"}
  - {d: 0, t: 1, k: call, l: "21. Tick the consent checkbox, then click Start"}
  - {d: 1, t: 1, k: call, l: "22. showScreen(\"face\"); enterFaceStep(): getUserMedia({video})", self: true}
  - frame: opt
    sections:
      - guard: "[getUserMedia for the camera throws]"
        body:
          - {d: 1, t: 1, k: call, l: "B.1. setFaceError(\"Could not access the camera...\")", self: true}
          - {d: 1, t: 0, k: ret, l: "B.2. Show \"Camera unavailable\""}
  - {d: 1, t: 0, k: ret, l: "23. Show face screen; \"I am ready\" enabled"}
  - {d: 0, t: 1, k: call, l: "24. Click I am ready"}
  - {d: 1, t: 1, k: call, l: "25. runFaceCapture(): countdown -> canvas.toBlob(\"image/jpeg\")", self: true}
  - {d: 1, t: 2, k: call, l: "26. POST /Profile/EnrollFace (multipart: face=face.jpg)"}
  - frame: opt
    sections:
      - guard: "[face is null OR face.Length == 0]"
        body:
          - {d: 2, t: 1, k: ret, l: 'C.1. Return 400 { error: "A face image is required." }'}
          - {d: 1, t: 0, k: ret, l: 'C.2. failFaceStep(error) - red oval, "Check failed", Try again'}
  - {d: 2, t: 3, k: call, l: "27. EnrollAsync(\"face\", bytes, fileName, contentType, ct)"}
  - {d: 3, t: 4, k: call, l: "28. POST api/profiles/me/biometrics/face (multipart file)"}
  - {d: 4, t: 5, k: call, l: "29. Forward (route profiles-biometrics-route, no prefix strip)"}
  - {d: 5, t: 5, k: call, l: "30. Guid.Parse(User.FindFirstValue(ClaimTypes.NameIdentifier))", self: true}
  - {d: 5, t: 6, k: call, l: '31. EnrollAsync(userId, "Face", file, ct)'}
  - frame: opt
    sections:
      - guard: "[file is null OR file.Length == 0]"
        body:
          - {d: 6, t: 5, k: ret, l: 'D.1. throw ArgumentException("A sample file is required.")'}
          - {d: 5, t: 4, k: ret, l: "D.2. Return 400 ApiResponse.Fail(ex.Message)"}
          - {d: 4, t: 3, k: ret, l: "D.3. Return 400"}
          - {d: 3, t: 2, k: ret, l: "D.4. Return (false, null, envelope.Message)"}
          - {d: 2, t: 1, k: ret, l: "D.5. Return 400 { error }"}
          - {d: 1, t: 0, k: ret, l: 'D.6. failFaceStep(error) - red oval, "Check failed", Try again'}
  - {d: 6, t: 8, k: call, l: "32. EmbedFaceAsync(file, ct)"}
  - {d: 8, t: 9, k: call, l: "33. POST /internal/biometrics/face/embed (multipart)"}
  - frame: opt
    sections:
      - guard: "[ai-service returns 422 - quality rejection]"
        body:
          - {d: 9, t: 8, k: ret, l: "E.1. Return 422 {detail}"}
          - {d: 8, t: 6, k: ret, l: "E.2. throw BiometricQualityException(detail)"}
          - {d: 6, t: 5, k: ret, l: "E.3. propagate BiometricQualityException"}
          - {d: 5, t: 4, k: ret, l: "E.4. Return 422 ApiResponse.Fail(ex.Message)"}
          - {d: 4, t: 3, k: ret, l: "E.5. Return 422"}
          - {d: 3, t: 2, k: ret, l: "E.6. Return (false, null, envelope.Message)"}
          - {d: 2, t: 1, k: ret, l: "E.7. Return 400 { error }"}
          - {d: 1, t: 0, k: ret, l: "E.8. failFaceStep(reason)"}
  - {d: 9, t: 8, k: ret, l: "34. Return 200 FaceEmbedResponse"}
  - {d: 8, t: 6, k: ret, l: "35. Return BiometricEmbeddingResult"}
  - {d: 6, t: 7, k: call, l: '36. GetAsync(userId, "Face", ct)'}
  - {d: 7, t: 12, k: call, l: '37. SELECT ProfileBiometric WHERE UserId AND Modality="Face"'}
  - {d: 12, t: 7, k: ret, l: "38. Return row / null"}
  - {d: 7, t: 6, k: ret, l: "39. Return ProfileBiometric?"}
  - frame: alt
    sections:
      - guard: "[first enrollment - no Face template yet]"
        body:
          - {d: 6, t: 7, k: call, l: "G-a.1. AddAsync(ProfileBiometric{Modality=\"Face\"})"}
          - {d: 7, t: 12, k: call, l: "G-a.2. INSERT ProfileBiometric (SaveChangesAsync)"}
          - {d: 12, t: 7, k: ret, l: "G-a.3. Return rows affected"}
          - {d: 7, t: 6, k: ret, l: "G-a.4. Return"}
      - guard: "[re-enrollment - a Face template already exists]"
        body:
          - {d: 6, t: 6, k: call, l: "G-b.1. EnsureReEnrollmentMatches(): Cosine vs threshold 0.35", self: true}
          - frame: opt
            sections:
              - guard: "[existing.Dim != candidate.Dim OR existing.ModelVersion != candidate.ModelVersion]"
                body:
                  - {d: 6, t: 5, k: ret, l: "H.1. throw InvalidOperationException"}
                  - {d: 5, t: 4, k: ret, l: "H.2. Return 400 ApiResponse.Fail(ex.Message)"}
                  - {d: 4, t: 3, k: ret, l: "H.3. Return 400"}
                  - {d: 3, t: 2, k: ret, l: "H.4. Return (false, null, envelope.Message)"}
                  - {d: 2, t: 1, k: ret, l: "H.5. Return 400 { error }"}
                  - {d: 1, t: 0, k: ret, l: "H.6. failFaceStep(error)"}
          - frame: opt
            sections:
              - guard: "[score < threshold]"
                body:
                  - {d: 6, t: 5, k: ret, l: "J.1. throw BiometricIdentityMismatchException(\"Face\", ...)"}
                  - {d: 5, t: 4, k: ret, l: "J.2. Return 409 ApiResponse.Fail(ex.Message)"}
                  - {d: 4, t: 3, k: ret, l: "J.3. Return 409"}
                  - {d: 3, t: 2, k: ret, l: "J.4. Return (false, null, envelope.Message)"}
                  - {d: 2, t: 1, k: ret, l: "J.5. Return 400 { error }"}
                  - {d: 1, t: 0, k: ret, l: "J.6. failFaceStep(\"The new face sample does not match...\")"}
          - {d: 6, t: 7, k: call, l: "G-b.2. SaveChangesAsync(ct)"}
          - {d: 7, t: 12, k: call, l: "G-b.3. UPDATE ProfileBiometrics SET Embedding, Quality, UpdatedAt"}
          - {d: 12, t: 7, k: ret, l: "G-b.4. Return rows affected"}
          - {d: 7, t: 6, k: ret, l: "G-b.5. Return"}
  - {d: 6, t: 7, k: call, l: "40. GetAsync(userId, \"Voice\", ct)"}
  - {d: 7, t: 12, k: call, l: '41. SELECT ProfileBiometric WHERE UserId AND Modality="Voice"'}
  - {d: 12, t: 7, k: ret, l: "42. Return row / null"}
  - {d: 7, t: 6, k: ret, l: "43. Return ProfileBiometric?"}
  - frame: alt
    sections:
      - guard: "[Voice is not enrolled yet]"
        body:
          - {d: 6, t: 6, k: call, l: 'K-a.1. bonusStatus = "NotYetEligible" - no PaymentAPI call', self: true}
      - guard: "[both Face and Voice are now enrolled]"
        body:
          - {d: 6, t: 7, k: call, l: "K-b.1. ListByModalityAsync(\"Face\", ct)"}
          - {d: 7, t: 12, k: call, l: "K-b.2. SELECT ProfileBiometrics WHERE Modality=\"Face\""}
          - {d: 12, t: 7, k: ret, l: "K-b.3. Return rows"}
          - {d: 7, t: 6, k: ret, l: "K-b.4. Return List<ProfileBiometric>"}
          - {d: 6, t: 6, k: call, l: "K-b.5. canonicalAccount = oldest template with Cosine >= 0.5", self: true}
          - frame: alt
            sections:
              - guard: "[canonicalAccount is null OR belongs to an earlier account]"
                body:
                  - {d: 6, t: 6, k: call, l: "L-a.1. bonusStatus = \"IdentityAlreadyClaimed\"", self: true}
              - guard: "[this account owns the face identity]"
                body:
                  - {d: 6, t: 10, k: call, l: "L-b.1. AwardCreditAsync(userId, 100, userId, ...) [best-effort]"}
                  - {d: 10, t: 11, k: call, l: "L-b.2. POST /api/internal/credit/award"}
                  - frame: alt
                    sections:
                      - guard: "[200, Awarded == true]"
                        body:
                          - {d: 11, t: 10, k: ret, l: "M-a.1. Return 200 CreditAwardResponse{Awarded=true}"}
                          - {d: 10, t: 6, k: ret, l: 'M-a.2. Return CreditAwardResponse -> bonusStatus = "Awarded"'}
                      - guard: "[200, Awarded == false - idempotent no-op, the account already had the bonus]"
                        body:
                          - {d: 11, t: 10, k: ret, l: "M-b.1. 200 CreditAwardResponse{Success=true, Awarded=false}"}
                          - {d: 10, t: 6, k: ret, l: 'M-b.2. Return CreditAwardResponse -> bonusStatus = "AlreadyAwarded"'}
                      - guard: "[non-2xx, unreachable, or the client throws]"
                        body:
                          - {d: 11, t: 10, k: ret, l: "M-c.1. Non-2xx / no response"}
                          - {d: 10, t: 6, k: ret, l: "M-c.2. Return CreditAwardResponse{Success=false} [best-effort]"}
  - {d: 6, t: 5, k: ret, l: "44. Return BiometricEnrollResponse{Modality=\"Face\"}"}
  - {d: 5, t: 4, k: ret, l: '45. Return 200 ApiResponse.Ok(result, "Enrolled.")'}
  - {d: 4, t: 3, k: ret, l: "46. Return 200"}
  - {d: 3, t: 2, k: ret, l: "47. Return (true, BiometricEnrollModel, null)"}
  - {d: 2, t: 1, k: ret, l: "48. Return 200 { enrolled: true, bonusStatus }"}
  - {d: 1, t: 0, k: ret, l: "49. mergeBonusStatus(); facePassed = true [see #2]"}
