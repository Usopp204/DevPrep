feature: ViewEvaluationReport
title: View Evaluation Report
uc_id: ""
uc_label: "[UC-56]"
backlog: [74, 76, 68, 69]

participants:
  - name: Candidate
    kind: actor
    w: 30
  - name: ":Report Page UI"
    kind: box
    w: 180
  - name: ":EvaluationController\n(WebClient)"
    kind: box
    w: 220
  - name: ":EvaluationService\n(WebClient)"
    kind: box
    w: 210
  - name: ":API Gateway"
    kind: box
    w: 140
  - name: ":InterviewSessionController\n(InterviewAPI)"
    kind: box
    w: 250
  - name: ":SessionService\n(InterviewAPI)"
    kind: box
    w: 200
  - name: ":SessionRepository\n(InterviewAPI)"
    kind: box
    w: 200
  - name: ":EvaluationController\n(EvaluationAPI)"
    kind: box
    w: 220
  - name: ":InterviewApiClient\n(EvaluationAPI)"
    kind: box
    w: 220
  - name: ":EvaluationService\n(EvaluationAPI)"
    kind: box
    w: 220
  - name: ":EvaluationRepository\n(EvaluationAPI)"
    kind: box
    w: 230
  - name: ":AiServiceClient\n(EvaluationAPI)"
    kind: box
    w: 200
  - name: ":ai-service\n/internal/report"
    kind: box
    w: 220
  - name: "SQL Server\n(DevPrep_Interview)"
    kind: db
    w: 130
  - name: "SQL Server\n(DevPrep_Evaluation)"
    kind: db
    w: 140

flow:
  # ---------------- Phase 1: open the page + transcript ----------------
  - {d: 0, t: 1, k: call, l: "1. Open the evaluation report for a session [see #9]"}
  - {d: 1, t: 2, k: call, l: "2. GET /Evaluation/Report?sessionId={id}&durationActualSec={n}"}
  - {d: 2, t: 3, k: call, l: "3. GetReportAsync(sessionId, durationActualSec, ct)"}
  - {d: 3, t: 4, k: call, l: "4. GET api/interview/sessions/{sessionId}/transcript"}
  - {d: 4, t: 5, k: call, l: "5. Forward (route interview-route, no prefix strip)"}
  - {d: 5, t: 5, k: call, l: "6. Guid.Parse(User.FindFirstValue(ClaimTypes.NameIdentifier))", self: true}
  - {d: 5, t: 6, k: call, l: "7. GetTranscriptAsync(userId, sessionId, ct)"}
  - {d: 6, t: 7, k: call, l: "8. GetWithFullHistoryAsync(sessionId, ct)"}
  - {d: 7, t: 14, k: call, l: "9. SELECT InterviewSession + SessionQuestions + ChatMessages"}
  - {d: 14, t: 7, k: ret, l: "10. Return the session graph / null"}
  - {d: 7, t: 6, k: ret, l: "11. Return InterviewSession?"}
  - frame: opt
    sections:
      - guard: "[session is null OR session.UserId != userId]"
        body:
          - {d: 6, t: 5, k: ret, l: 'A.1. throw InvalidOperationException("Session not found.")'}
          - {d: 5, t: 4, k: ret, l: "A.2. Return 400 ApiResponse.Fail(ex.Message)"}
          - {d: 4, t: 3, k: ret, l: "A.3. Return 400"}
          - {d: 3, t: 2, k: ret, l: 'A.4. Return (false, null, "Session not found.")'}
          - {d: 2, t: 1, k: ret, l: "A.5. 302 RedirectToAction(\"Index\", \"Interview\")"}
          - {d: 1, t: 0, k: ret, l: "A.6. Interview dashboard with the error message"}
  - {d: 6, t: 6, k: call, l: "12. Keep only questions that have a ChatMessage", self: true}
  - {d: 6, t: 5, k: ret, l: "13. Return TranscriptResponse"}
  - {d: 5, t: 4, k: ret, l: "14. Return 200 ApiResponse.Ok(result)"}
  - {d: 4, t: 3, k: ret, l: "15. Return 200"}
  - frame: opt
    sections:
      - guard: '[transcript.Status != "Completed" - Cancelled, Expired, or still running]'
        body:
          - {d: 3, t: 2, k: ret, l: "B.1. Return (true, ReportViewModel{EmptyReason})"}
          - {d: 2, t: 1, k: ret, l: "B.2. Return View Report"}
          - {d: 1, t: 0, k: ret, l: "B.3. Show report page with EmptyReason, no scores"}

  # ---------------- Phase 2: GET an existing report ----------------
  - {d: 3, t: 4, k: call, l: "16. GET api/evaluation/sessions/{sessionId}/report"}
  - {d: 4, t: 8, k: call, l: "17. Forward (route evaluation-route, no prefix strip)"}
  - {d: 8, t: 9, k: call, l: "18. OwnsSessionAsync(sessionId, bearerToken)"}
  - {d: 9, t: 5, k: call, l: "19. GET api/interview/sessions/{id}/owns"}
  - {d: 5, t: 9, k: ret, l: "20. Return 200 ApiResponse.Ok / 404 {error}"}
  - {d: 9, t: 8, k: ret, l: "21. Return bool"}
  - frame: alt
    sections:
      - guard: "[the caller does not own the session]"
        body:
          - {d: 8, t: 4, k: ret, l: "C-a.1. Return 403 {error}"}
          - {d: 4, t: 3, k: ret, l: "C-a.2. Return 403"}
      - guard: "[the caller owns the session]"
        body:
          - {d: 8, t: 10, k: call, l: "C-b.1. GetExistingReportAsync(sessionId, bearerToken, ct)"}
          - {d: 10, t: 9, k: call, l: "C-b.2. GetSessionFeedbackEligibilityAsync(...)"}
          - {d: 9, t: 5, k: call, l: "C-b.3. GET api/interview/sessions/{id}/feedback-eligibility"}
          - {d: 5, t: 9, k: ret, l: "C-b.4. Return 200 SessionFeedbackEligibilityResponse"}
          - {d: 9, t: 10, k: ret, l: "C-b.5. Return SessionFeedbackEligibilityResult"}
          - frame: alt
            sections:
              - guard: '[eligibility.Status != "Completed" OR !eligibility.Eligible]'
                body:
                  - {d: 10, t: 8, k: ret, l: "D-a.1. throw SessionNotEligibleForPerformanceReportException"}
                  - {d: 8, t: 4, k: ret, l: "D-a.2. Return 400 {error}"}
                  - {d: 4, t: 3, k: ret, l: "D-a.3. Return 400 - report stays null"}
              - guard: "[Completed and eligible]"
                body:
                  - {d: 10, t: 11, k: call, l: "D-b.1. GetReportBySessionAsync(sessionId, ct)"}
                  - {d: 11, t: 15, k: call, l: "D-b.2. SELECT FeedbackReport WHERE SessionId"}
                  - {d: 15, t: 11, k: ret, l: "D-b.3. Return row / null"}
                  - {d: 11, t: 10, k: ret, l: "D-b.4. Return FeedbackReport?"}
                  - frame: alt
                    sections:
                      - guard: "[no FeedbackReport row yet]"
                        body:
                          - {d: 10, t: 8, k: ret, l: "E-a.1. Return null"}
                          - {d: 8, t: 4, k: ret, l: "E-a.2. Return 404 {error}"}
                          - {d: 4, t: 3, k: ret, l: "E-a.3. Return 404 - report stays null"}
                      - guard: "[a FeedbackReport row already exists]"
                        body:
                          - {d: 10, t: 8, k: ret, l: "E-b.1. Return ReportResponse"}
                          - {d: 8, t: 4, k: ret, l: "E-b.2. Return 200 ApiResponse.Ok(result)"}
                          - {d: 4, t: 3, k: ret, l: "E-b.3. Return 200"}

  # ---------------- Phase 3: POST build a new report (only when none exists) ----------------
  - frame: opt
    sections:
      - guard: "[report is still null - the GET above returned nothing usable]"
        body:
          - {d: 3, t: 4, k: call, l: "F.1. POST api/evaluation/sessions/{id}/report"}
          - {d: 4, t: 8, k: call, l: "F.2. Forward (route evaluation-route, no prefix strip)"}
          - {d: 8, t: 9, k: call, l: "F.3. OwnsSessionAsync(sessionId, bearer token) - IDOR guard"}
          - {d: 9, t: 5, k: call, l: "F.4. GET api/interview/sessions/{id}/owns"}
          - {d: 5, t: 9, k: ret, l: "F.5. 200 / 404"}
          - {d: 9, t: 8, k: ret, l: "F.6. Return bool"}
          - frame: alt
            sections:
              - guard: "[the caller does not own the session]"
                body:
                  - {d: 8, t: 4, k: ret, l: "G-a.1. Return 403 {error}"}
                  - {d: 4, t: 3, k: ret, l: "G-a.2. Return 403"}
              - guard: "[the caller owns the session]"
                body:
                  - {d: 8, t: 10, k: call, l: "G-b.1. BuildReportAsync(sessionId, req, bearerToken, ct)"}
                  - {d: 10, t: 9, k: call, l: "G-b.2. GetSessionFeedbackEligibilityAsync(...)"}
                  - {d: 9, t: 5, k: call, l: "G-b.3. GET api/interview/sessions/{id}/feedback-eligibility"}
                  - {d: 5, t: 9, k: ret, l: "G-b.4. 200 SessionFeedbackEligibilityResponse{Status, Eligible}"}
                  - {d: 9, t: 10, k: ret, l: "G-b.5. Return SessionFeedbackEligibilityResult"}
                  - {d: 10, t: 11, k: call, l: "G-b.6. ReportExistsAsync(sessionId, ct)"}
                  - {d: 11, t: 15, k: call, l: "G-b.7. SELECT EXISTS FeedbackReports WHERE SessionId"}
                  - {d: 15, t: 11, k: ret, l: "G-b.8. Return bool"}
                  - {d: 11, t: 10, k: ret, l: "G-b.9. Return bool"}
                  - {d: 10, t: 11, k: call, l: "G-b.10. GetEvaluationsBySessionAsync(sessionId, ct)"}
                  - {d: 11, t: 15, k: call, l: "G-b.11. SELECT AnswerEvaluations WHERE SessionId"}
                  - {d: 15, t: 11, k: ret, l: "G-b.12. Return rows"}
                  - {d: 11, t: 10, k: ret, l: "G-b.13. Return List<AnswerEvaluation>"}
                  - frame: alt
                    sections:
                      - guard: "[not eligible OR a report already exists OR there are 0 evaluations]"
                        body:
                          - {d: 10, t: 8, k: ret, l: "H-a.1. throw SessionNotEligibleForPerformanceReportException"}
                          - {d: 8, t: 4, k: ret, l: "H-a.2. Return 400 ApiResponse.Fail(ex.Message)"}
                          - {d: 4, t: 3, k: ret, l: "H-a.3. Return 400 {error}"}
                      - guard: "[eligible, no report yet, at least 1 evaluation]"
                        body:
                          - {d: 10, t: 12, k: call, l: "H-b.1. BuildReportAsync(AiBuildReportRequest)"}
                          - {d: 12, t: 13, k: call, l: "H-b.2. POST /internal/report (header X-Internal-Api-Key)"}
                          - {d: 13, t: 13, k: call, l: "H-b.3. aggregate(); GeminiJudge summarizes the summary", self: true}
                          - {d: 13, t: 12, k: ret, l: "H-b.4. Return 200 {overall_score, categories, summary, duration}"}
                          - {d: 12, t: 10, k: ret, l: "H-b.5. Return AiBuildReportResponse"}
                          - {d: 10, t: 10, k: call, l: "H-b.6. Average the criteria; Grade = A/B/C/D; build the rows", self: true}
                          - {d: 10, t: 11, k: call, l: "H-b.7. AddReportAsync(report, ct)"}
                          - {d: 11, t: 15, k: call, l: "H-b.8. INSERT FeedbackReport (SaveChangesAsync)"}
                          - {d: 15, t: 11, k: ret, l: "H-b.9. Return rows affected"}
                          - {d: 11, t: 10, k: ret, l: "H-b.10. Return FeedbackReport"}
                          - {d: 10, t: 11, k: call, l: "H-b.11. AddMetricsAsync(metrics, ct)"}
                          - {d: 11, t: 15, k: call, l: "H-b.12. INSERT PerformanceMetrics (OverallScore, TechnicalScore)"}
                          - {d: 15, t: 11, k: ret, l: "H-b.13. Return rows affected"}
                          - {d: 11, t: 10, k: ret, l: "H-b.14. Return"}
                          - {d: 10, t: 8, k: ret, l: "H-b.15. Return ReportResponse"}
                          - {d: 8, t: 4, k: ret, l: "H-b.16. Return 200 ApiResponse.Ok(result)"}
                          - {d: 4, t: 3, k: ret, l: "H-b.17. Return 200 -> report = the freshly built report"}

  # ---------------- Phase 4: GET per-answer evaluations + render ----------------
  - {d: 3, t: 4, k: call, l: "22. GET api/evaluation/sessions/{sessionId}/answers"}
  - {d: 4, t: 8, k: call, l: "23. Forward (route evaluation-route, no prefix strip)"}
  - {d: 8, t: 9, k: call, l: "24. OwnsSessionAsync(sessionId, bearer token) - IDOR guard"}
  - {d: 9, t: 5, k: call, l: "25. GET api/interview/sessions/{id}/owns"}
  - {d: 5, t: 9, k: ret, l: "26. 200 / 404"}
  - {d: 9, t: 8, k: ret, l: "27. Return bool"}
  - frame: alt
    sections:
      - guard: "[the caller does not own the session]"
        body:
          - {d: 8, t: 4, k: ret, l: "J-a.1. Return 403 {error}"}
          - {d: 4, t: 3, k: ret, l: "J-a.2. Return 403"}
      - guard: "[the caller owns the session]"
        body:
          - {d: 8, t: 10, k: call, l: "J-b.1. GetAnswerEvaluationsAsync(sessionId, ct)"}
          - {d: 10, t: 11, k: call, l: "J-b.2. GetEvaluationsBySessionAsync(sessionId, ct)"}
          - {d: 11, t: 15, k: call, l: "J-b.3. SELECT AnswerEvaluations WHERE SessionId"}
          - {d: 15, t: 11, k: ret, l: "J-b.4. Return rows"}
          - {d: 11, t: 10, k: ret, l: "J-b.5. Return List<AnswerEvaluation>"}
          - {d: 10, t: 8, k: ret, l: "J-b.6. Return List<EvaluateAnswerResponse>"}
          - {d: 8, t: 4, k: ret, l: "J-b.7. Return 200 ApiResponse.Ok(result)"}
          - {d: 4, t: 3, k: ret, l: "J-b.8. Return 200"}
  - {d: 3, t: 3, k: call, l: "28. Join the evaluations onto the ordered transcript questions", self: true}
  - {d: 3, t: 2, k: ret, l: "29. Return (true, ReportViewModel)"}
  - {d: 2, t: 1, k: ret, l: "30. Return View Report"}
  - {d: 1, t: 0, k: ret, l: "31. Show report page: score, Grade, per-question list"}
