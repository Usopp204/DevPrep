feature: VerifyVoiceAnswer
title: Verify Voice Answer
uc_id: "UC-10"
uc_label: "[UC-55]"
backlog: [52, 67]

participants:
  - name: Candidate
    kind: actor
    w: 30
  - name: ":Interview Room UI"
    kind: box
    w: 180
  - name: ":InterviewController\n(WebClient)"
    kind: box
    w: 200
  - name: ":InterviewService\n(WebClient)"
    kind: box
    w: 190
  - name: ":API Gateway"
    kind: box
    w: 140
  - name: ":SessionVerificationController\n(InterviewAPI)"
    kind: box
    w: 250
  - name: ":BiometricVerificationService\n(InterviewAPI)"
    kind: box
    w: 240
  - name: ":SessionRepository\n(InterviewAPI)"
    kind: box
    w: 200
  - name: ":ProfileBiometricsRepository\n(InterviewAPI)"
    kind: box
    w: 230
  - name: ":SessionVerificationEventRepository\n(InterviewAPI)"
    kind: box
    w: 280
  - name: ":AiServiceClient\n(InterviewAPI)"
    kind: box
    w: 190
  - name: ":ai-service\n(Deepgram STT + SpeechBrain)"
    kind: box
    w: 280
  - name: ":CheatingStrikeHelper\n(InterviewAPI)"
    kind: box
    w: 200
  - name: "SQL Server"
    kind: db
    w: 70

flow:
  - {d: 0, t: 1, k: call, l: "1. Click the microphone button to start recording the answer"}
  - {d: 1, t: 1, k: call, l: "2. startRecording(): MediaRecorder.start()", self: true}
  - frame: opt
    sections:
      - guard: "[MediaRecorder does not support audio/webm OR getUserMedia throws]"
        body:
          - {d: 1, t: 1, k: call, l: "A.1. appendBubble(\"AI\", \"Microphone unavailable...\")", self: true}
          - {d: 1, t: 0, k: ret, l: "A.2. Show the reason"}
  - {d: 1, t: 0, k: ret, l: "3. Mic button shows the recording state"}
  - {d: 0, t: 1, k: call, l: "4. Click the microphone button again to stop"}
  - {d: 1, t: 1, k: call, l: "5. onstop -> transcribe(): blob = new Blob(chunks)", self: true}
  - {d: 1, t: 2, k: call, l: "6. POST /Interview/Stt (multipart)"}
  - frame: opt
    sections:
      - guard: "[sessionId or voiceCheckId is Guid.Empty OR audio is null/empty]"
        body:
          - {d: 2, t: 1, k: ret, l: "B.1. Return 400 {error}"}
          - {d: 1, t: 0, k: ret, l: 'B.2. appendBubble("AI", "Transcription failed: <error>.")'}
  - {d: 2, t: 3, k: call, l: "7. TranscribeAudioAsync(sessionId, voiceCheckId, bytes, ...)"}
  - {d: 3, t: 4, k: call, l: "8. POST api/interview/sessions/{id}/verify/voice-answer"}
  - {d: 4, t: 5, k: call, l: "9. Forward (route interview-route, no prefix strip)"}
  - {d: 5, t: 5, k: call, l: "10. Guid.Parse(User.FindFirstValue(ClaimTypes.NameIdentifier))", self: true}
  - {d: 5, t: 6, k: call, l: "11. VerifyVoiceAnswerAsync(userId, sessionId, checkId, ...)"}
  - frame: opt
    sections:
      - guard: '[checkId == Guid.Empty OR audio is null/empty OR session.Status != "InProgress" OR the checkId belongs to a different session/user/modality]'
        body:
          - {d: 6, t: 5, k: ret, l: "C.1. throw ArgumentException / InvalidOperationException"}
          - {d: 5, t: 4, k: ret, l: "C.2. Return 400 ApiResponse.Fail(ex.Message)"}
          - {d: 4, t: 3, k: ret, l: "C.3. Return 400"}
          - {d: 3, t: 2, k: ret, l: "C.4. Return (false, null, \"Transcription failed (400).\")"}
          - {d: 2, t: 1, k: ret, l: "C.5. Return 400 { error }"}
          - {d: 1, t: 0, k: ret, l: "C.6. appendBubble(\"AI\", \"Transcription failed (400).\")"}
  - {d: 6, t: 7, k: call, l: "12. GetByIdAsync(sessionId, ct)"}
  - {d: 7, t: 13, k: call, l: "13. SELECT InterviewSession WHERE SessionId AND !IsDeleted"}
  - {d: 13, t: 7, k: ret, l: "14. Return session row / null"}
  - {d: 7, t: 6, k: ret, l: "15. Return InterviewSession?"}
  - frame: opt
    sections:
      - guard: "[session is null OR session.UserId != userId]"
        body:
          - {d: 6, t: 5, k: ret, l: 'D.1. throw KeyNotFoundException("Session not found.")'}
          - {d: 5, t: 4, k: ret, l: "D.2. Return 404 ApiResponse.Fail(ex.Message)"}
          - {d: 4, t: 3, k: ret, l: "D.3. Return 404"}
          - {d: 3, t: 2, k: ret, l: 'D.4. Return (false, null, "Transcription failed (404).")'}
          - {d: 2, t: 1, k: ret, l: "D.5. Return 400 { error }"}
          - {d: 1, t: 0, k: ret, l: "D.6. appendBubble(\"AI\", \"Transcription failed (404).\")"}
  - {d: 6, t: 6, k: call, l: "16. Copy the upload into a byte[]; read maxStrikes from config", self: true}
  - {d: 6, t: 10, k: call, l: "17. TranscribeAsync(audioBytes, fileName, contentType, ct)"}
  - {d: 10, t: 11, k: call, l: "18. POST /internal/stt (multipart audio) - Deepgram"}
  - {d: 11, t: 10, k: ret, l: "19. 200 { text }"}
  - {d: 10, t: 6, k: ret, l: "20. Return transcript (awaited at whichever return path runs)"}
  - {d: 6, t: 8, k: call, l: '21. GetAsync(userId, "Voice", ct)'}
  - {d: 8, t: 13, k: call, l: '22. SELECT ProfileBiometric WHERE UserId AND Modality="Voice"'}
  - {d: 13, t: 8, k: ret, l: "23. Return row / null"}
  - {d: 8, t: 6, k: ret, l: "24. Return ProfileBiometric?"}
  - frame: opt
    sections:
      - guard: "[Biometrics:Enabled == false OR no Voice enrollment found for this user]"
        body:
          - {d: 6, t: 5, k: ret, l: "E.1. Return VoiceAnswerVerifyResponse{VoiceChecked=false}"}
          - {d: 5, t: 4, k: ret, l: "E.2. Return 200 ApiResponse.Ok(result)"}
          - {d: 4, t: 3, k: ret, l: "E.3. Return 200"}
          - {d: 3, t: 2, k: ret, l: "E.4. Return (true, SttResponse{VoiceChecked=false}, null)"}
          - {d: 2, t: 1, k: ret, l: "E.5. Return 200 JSON"}
          - {d: 1, t: 0, k: ret, l: "E.6. Transcript dropped into the answer box"}
  - {d: 6, t: 9, k: call, l: "25. GetIncidentAsync(checkId, ct)"}
  - {d: 9, t: 13, k: call, l: "26. SELECT SessionVerificationEvent WHERE IncidentId = @checkId"}
  - {d: 13, t: 9, k: ret, l: "27. Return row / null"}
  - {d: 9, t: 6, k: ret, l: "28. Return SessionVerificationEvent?"}
  - frame: alt
    sections:
      - guard: "[a voice check for this checkId already exists in THIS session - replayed request]"
        body:
          - {d: 6, t: 6, k: call, l: "F-a.1. duplicate = true; reuse the stored event", self: true}
      - guard: "[no event for this checkId yet - run the speaker check]"
        body:
          - {d: 6, t: 10, k: call, l: "F-b.1. VerifyVoiceAsync(probe, storedEmbedding, ct)"}
          - {d: 10, t: 11, k: call, l: "F-b.2. POST /internal/biometrics/verify (form)"}
          - frame: opt
            sections:
              - guard: "[ai-service returns 422 (quality) OR any other ai-service failure]"
                body:
                  - {d: 11, t: 10, k: ret, l: "H.1. Return 422 {detail}"}
                  - {d: 10, t: 6, k: ret, l: "H.2. throw BiometricQualityException(detail) / other Exception"}
                  - {d: 6, t: 5, k: ret, l: "H.3. Return VoiceAnswerVerifyResponse{VoiceChecked=false}"}
                  - {d: 5, t: 4, k: ret, l: "H.4. Return 200 ApiResponse.Ok(result)"}
                  - {d: 4, t: 3, k: ret, l: "H.5. Return 200"}
                  - {d: 3, t: 2, k: ret, l: "H.6. Return (true, SttResponse{...}, null)"}
                  - {d: 2, t: 1, k: ret, l: "H.7. Return 200 JSON"}
                  - {d: 1, t: 0, k: ret, l: "H.8. Transcript in the answer box, no warning"}
          - {d: 11, t: 10, k: ret, l: "F-b.3. 200 VerifyResponse{match, score, threshold}"}
          - {d: 10, t: 6, k: ret, l: "F-b.4. Return AiFaceVerifyResponse{Match, Score, Threshold}"}
          - {d: 6, t: 6, k: call, l: "F-b.5. Build SessionVerificationEvent{Modality=\"Voice\"}", self: true}
          - {d: 6, t: 9, k: call, l: "F-b.6. TryAddIncidentAsync(event)"}
          - {d: 9, t: 13, k: call, l: "F-b.7. INSERT SessionVerificationEvent"}
          - {d: 13, t: 9, k: ret, l: "F-b.8. Return rows affected / unique-index violation on IncidentId"}
          - {d: 9, t: 6, k: ret, l: "F-b.9. Return inserted"}
          - frame: opt
            sections:
              - guard: "[inserted == false - a concurrent request already stored this checkId]"
                body:
                  - {d: 6, t: 9, k: call, l: "G.1. GetIncidentAsync(checkId, ct)"}
                  - {d: 9, t: 13, k: call, l: "G.2. SELECT SessionVerificationEvent WHERE IncidentId"}
                  - {d: 13, t: 9, k: ret, l: "G.3. Return row"}
                  - {d: 9, t: 6, k: ret, l: "G.4. Return the stored event (duplicate = true)"}
  - {d: 6, t: 9, k: call, l: "29. ListBySessionAsync(sessionId, \"InSession\", ct)"}
  - {d: 9, t: 13, k: call, l: "30. SELECT SessionVerificationEvents WHERE Phase=\"InSession\""}
  - {d: 13, t: 9, k: ret, l: "31. Return event rows"}
  - {d: 9, t: 6, k: ret, l: "32. Return List<SessionVerificationEvent>"}
  - {d: 6, t: 12, k: call, l: "33. ComputeEffectiveStrikeCount(events, noFaceStrikeThreshold)"}
  - {d: 12, t: 6, k: ret, l: "34. Return directStrikeCount + noFaceCount / threshold"}
  - {d: 6, t: 6, k: call, l: "35. Compute mismatch, displayStrikeCount, shouldEndSession", self: true}
  - frame: opt
    sections:
      - guard: "[shouldEndSession == true]"
        body:
          - {d: 6, t: 7, k: call, l: "P.1. GetByIdAsync(sessionId, ct) - EndSessionForCheatingAsync"}
          - {d: 7, t: 13, k: call, l: "P.2. SELECT InterviewSession by SessionId"}
          - {d: 13, t: 7, k: ret, l: "P.3. Return session row / null"}
          - {d: 7, t: 6, k: ret, l: "P.4. Return InterviewSession?"}
          - {d: 6, t: 6, k: call, l: "P.5. session.Status=\"Cancelled\"; EndedAt=now", self: true}
          - {d: 6, t: 7, k: call, l: "P.6. GetRoomBySessionAsync(sessionId, ct)"}
          - {d: 7, t: 13, k: call, l: "P.7. SELECT InterviewRoom by SessionId"}
          - {d: 13, t: 7, k: ret, l: "P.8. Return room row / null"}
          - {d: 7, t: 6, k: ret, l: "P.9. Return InterviewRoom?"}
          - frame: alt
            sections:
              - guard: "[room is not null]"
                body:
                  - {d: 6, t: 7, k: call, l: 'Q-a.1. UpdateRoomAsync(room{Status="Closed", ClosedAt=now}, ct)'}
                  - {d: 7, t: 13, k: call, l: "Q-a.2. UPDATE InterviewSessions SET Status, EndedAt + InterviewRoom"}
                  - {d: 13, t: 7, k: ret, l: "Q-a.3. Return rows affected"}
                  - {d: 7, t: 6, k: ret, l: "Q-a.4. Return"}
              - guard: "[room is null]"
                body:
                  - {d: 6, t: 7, k: call, l: "Q-b.1. SaveChangesAsync(ct)"}
                  - {d: 7, t: 13, k: call, l: "Q-b.2. UPDATE InterviewSession SET Status, EndedAt, UpdatedAt"}
                  - {d: 13, t: 7, k: ret, l: "Q-b.3. Return rows affected"}
                  - {d: 7, t: 6, k: ret, l: "Q-b.4. Return"}
  - {d: 6, t: 5, k: ret, l: "36. Return VoiceAnswerVerifyResponse{VoiceChecked=true}"}
  - {d: 5, t: 4, k: ret, l: "37. Return 200 ApiResponse.Ok(result)"}
  - {d: 4, t: 3, k: ret, l: "38. Return 200"}
  - {d: 3, t: 2, k: ret, l: "39. Return (true, SttResponse, null)"}
  - {d: 2, t: 1, k: ret, l: "40. Return 200 JSON (the full SttResponse)"}
  - frame: alt
    sections:
      - guard: "[data.voiceMatched !== false]"
        body:
          - {d: 1, t: 1, k: call, l: "R-a.1. inputEl.value = data.text; resetIdle()", self: true}
          - {d: 1, t: 0, k: ret, l: "R-a.2. Transcript in the answer box, no warning"}
      - guard: "[voiceMatched === false AND !shouldEndSession]"
        body:
          - {d: 1, t: 1, k: call, l: "R-b.1. setCheatingWarning(strikeText, \"warning\")", self: true}
          - {d: 1, t: 0, k: ret, l: "R-b.2. Show \"Verification warning\" alert + popup"}
      - guard: "[voiceMatched === false AND shouldEndSession]"
        body:
          - {d: 1, t: 1, k: call, l: "R-c.1. handleForcedCheatingEnd(message): ended=true", self: true}
          - {d: 1, t: 0, k: ret, l: "R-c.2. Show termination modal -> redirect to /Interview"}
