feature: EvaluateInterviewAnswer
title: Evaluate Interview Answer
uc_id: ""
uc_label: "(UC-42, 56 sub-flow)"
backlog: [73, 75, 70]

participants:
  - name: ":SessionService\n(InterviewAPI)"
    kind: box
    w: 200
  - name: ":EvaluationApiClient\n(InterviewAPI)"
    kind: box
    w: 220
  - name: ":EvaluationController\n(EvaluationAPI)"
    kind: box
    w: 220
  - name: ":InterviewApiClient\n(EvaluationAPI)"
    kind: box
    w: 220
  - name: ":InterviewSessionController\n(InterviewAPI)"
    kind: box
    w: 250
  - name: ":EvaluationService\n(EvaluationAPI)"
    kind: box
    w: 220
  - name: ":EvaluationRepository\n(EvaluationAPI)"
    kind: box
    w: 230
  - name: ":AiServiceClient\n(EvaluationAPI)"
    kind: box
    w: 200
  - name: ":ai-service\n/internal/evaluate-answer"
    kind: box
    w: 300
  - name: "SQL Server\n(DevPrep_Evaluation)"
    kind: db
    w: 130

flow:
  - {d: 0, t: 0, k: call, l: "1. [background] _gradingQueue.EnqueueAsync(GradingWorkItem) [see #5]", self: true}
  - {d: 0, t: 0, k: call, l: "2. Build EvaluateAnswerPayload; GradingBackgroundService drains the queue", self: true}
  - {d: 0, t: 1, k: call, l: "3. EvaluateAnswerAsync(sessionId, sessionQuestionId, ...)"}
  - {d: 1, t: 2, k: call, l: "4. POST api/evaluation/sessions/{id}/answers/{questionId}"}
  - {d: 2, t: 3, k: call, l: "5. OwnsSessionAsync(sessionId, bearerToken)"}
  - {d: 3, t: 4, k: call, l: "6. GET api/interview/sessions/{id}/owns"}
  - frame: opt
    sections:
      - guard: "[ownership check fails: 404 / 401 / 403 from InterviewAPI, OR the call throws - fail closed]"
        body:
          - {d: 4, t: 3, k: ret, l: "A.1. Return 404 {error} / 401 / 403"}
          - {d: 3, t: 2, k: ret, l: "A.2. Return false"}
          - {d: 2, t: 1, k: ret, l: "A.3. Return 403 {error}"}
          - {d: 1, t: 0, k: ret, l: "A.4. EnsureSuccessStatusCode() throws HttpRequestException"}
          - {d: 0, t: 0, k: call, l: "A.5. catch: LogWarning \"Background grading failed...\"", self: true}
  - {d: 4, t: 3, k: ret, l: "7. 200 ApiResponse.Ok(new {})"}
  - {d: 3, t: 2, k: ret, l: "8. Return true"}
  - {d: 2, t: 5, k: call, l: "9. EvaluateAnswerAsync(sessionId, answerId, req, ct)"}
  - {d: 5, t: 6, k: call, l: "10. GetBySessionQuestionAsync(sessionId, answerId, ct)"}
  - {d: 6, t: 9, k: call, l: "11. SELECT AnswerEvaluation WHERE SessionQuestionId"}
  - {d: 9, t: 6, k: ret, l: "12. Return row / null"}
  - {d: 6, t: 5, k: ret, l: "13. Return AnswerEvaluation?"}
  - frame: opt
    sections:
      - guard: "[an evaluation for this (SessionId, SessionQuestionId) already exists - replayed grading]"
        body:
          - {d: 5, t: 2, k: ret, l: "B.1. Return ToResponse(existing)"}
          - {d: 2, t: 1, k: ret, l: "B.2. Return 200 ApiResponse.Ok(result)"}
          - {d: 1, t: 0, k: ret, l: "B.3. Return"}
  - {d: 5, t: 7, k: call, l: "14. EvaluateAnswerAsync(AiEvaluateAnswerRequest)"}
  - {d: 7, t: 8, k: call, l: "15. POST /internal/evaluate-answer (header X-Internal-Api-Key)"}
  - {d: 8, t: 8, k: call, l: "16. GeminiJudge(); enrich_for(item); grade_item() -> median", self: true}
  - frame: opt
    sections:
      - guard: "[every judge run failed (e.g. Gemini rate limit) - grade_item returns None]"
        body:
          - {d: 8, t: 7, k: ret, l: "C.1. Return 200 EvaluateOut{score = null}"}
          - {d: 7, t: 5, k: ret, l: "C.2. Return AiEvaluateAnswerResponse{Score = null}"}
          - {d: 5, t: 2, k: ret, l: "C.3. throw InvalidOperationException"}
          - {d: 2, t: 1, k: ret, l: "C.4. Return 400 ApiResponse.Fail(ex.Message)"}
          - {d: 1, t: 0, k: ret, l: "C.5. EnsureSuccessStatusCode() throws HttpRequestException"}
          - {d: 0, t: 0, k: call, l: "C.6. catch: LogWarning", self: true}
  - {d: 8, t: 7, k: ret, l: "17. Return 200 EvaluateOut{score, criteria, analysis, ...}"}
  - {d: 7, t: 5, k: ret, l: "18. Return AiEvaluateAnswerResponse"}
  - {d: 5, t: 5, k: call, l: "19. Map to AnswerEvaluation", self: true}
  - {d: 5, t: 6, k: call, l: "20. AddEvaluationAsync(eval, ct)"}
  - {d: 6, t: 9, k: call, l: "21. INSERT AnswerEvaluation (SaveChangesAsync)"}
  - {d: 9, t: 6, k: ret, l: "22. Return rows affected"}
  - {d: 6, t: 5, k: ret, l: "23. Return AnswerEvaluation"}
  - {d: 5, t: 2, k: ret, l: "24. Return EvaluateAnswerResponse"}
  - {d: 2, t: 1, k: ret, l: "25. Return 200 ApiResponse.Ok(result)"}
  - {d: 1, t: 0, k: ret, l: "26. Return"}
  - {d: 0, t: 0, k: call, l: "27. Background task ends [see #18]", self: true}
