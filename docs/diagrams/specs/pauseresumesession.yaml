feature: PauseResumeSession
title: Pause Resume Session
uc_id: "UC-09"
uc_label: "[UC-41]"
backlog: [39, 40, 62, 65]

participants:
  - name: Candidate
    kind: actor
    w: 30
  - name: ":Interview Room UI"
    kind: box
    w: 180
  - name: ":InterviewController\n(WebClient)"
    kind: box
    w: 200
  - name: ":InterviewService\n(WebClient)"
    kind: box
    w: 190
  - name: ":API Gateway"
    kind: box
    w: 140
  - name: ":InterviewSessionController\n(InterviewAPI)"
    kind: box
    w: 250
  - name: ":SessionService\n(InterviewAPI)"
    kind: box
    w: 190
  - name: ":SessionRepository\n(InterviewAPI)"
    kind: box
    w: 200
  - name: "SQL Server"
    kind: db
    w: 70

flow:
  # ---------------- Phase 1: Pause ----------------
  - {d: 0, t: 1, k: call, l: "1. Click Pause Interview"}
  - {d: 1, t: 1, k: call, l: "2. pauseInterview(): guard, then pauseBtn.disabled = true", self: true}
  - frame: opt
    sections:
      - guard: "[paused OR ended OR !pauseUrl]"
        body:
          - {d: 1, t: 1, k: call, l: "F1.1. return early - no request sent", self: true}
          - {d: 1, t: 0, k: ret, l: "F1.2. Nothing happens (Pause button state unchanged)"}
  - {d: 1, t: 2, k: call, l: "3. POST /Interview/Pause?id={sessionId} (postProxy fetch)"}
  - {d: 2, t: 3, k: call, l: "4. PauseSessionAsync(id, ct)"}
  - {d: 3, t: 4, k: call, l: "5. POST api/interview/sessions/{sessionId}/pause"}
  - {d: 4, t: 5, k: call, l: "6. Forward (route interview-route, no prefix strip)"}
  - {d: 5, t: 5, k: call, l: "7. Guid.Parse(User.FindFirstValue(ClaimTypes.NameIdentifier))", self: true}
  - {d: 5, t: 6, k: call, l: "8. PauseSessionAsync(userId, sessionId, ct)"}
  - {d: 6, t: 7, k: call, l: "9. GetByIdAsync(sessionId, ct)"}
  - {d: 7, t: 8, k: call, l: "10. SELECT InterviewSession WHERE SessionId AND !IsDeleted"}
  - {d: 8, t: 7, k: ret, l: "11. Return session row / null"}
  - {d: 7, t: 6, k: ret, l: "12. Return InterviewSession?"}
  - frame: opt
    sections:
      - guard: "[session is null OR session.UserId != userId]"
        body:
          - {d: 6, t: 5, k: ret, l: 'F2.1. throw InvalidOperationException("Session not found.")'}
          - {d: 5, t: 4, k: ret, l: "F2.2. Return 400 ApiResponse.Fail(ex.Message)"}
          - {d: 4, t: 3, k: ret, l: "F2.3. Return 400"}
          - {d: 3, t: 2, k: ret, l: "F2.4. Return ApiCallResult.Fail(message, 400)"}
          - {d: 2, t: 1, k: ret, l: "F2.5. Return 400 { error }"}
          - {d: 1, t: 0, k: ret, l: "F2.6. appendBubble(\"AI\", \"Could not pause: ...\")"}
  - frame: opt
    sections:
      - guard: '[session.Status != "InProgress"]'
        body:
          - {d: 6, t: 5, k: ret, l: "F3.1. throw InvalidOperationException"}
          - {d: 5, t: 4, k: ret, l: "F3.2. Return 400 ApiResponse.Fail(ex.Message)"}
          - {d: 4, t: 3, k: ret, l: "F3.3. Return 400"}
          - {d: 3, t: 2, k: ret, l: "F3.4. Return ApiCallResult.Fail(message, 400)"}
          - {d: 2, t: 1, k: ret, l: "F3.5. Return 400 { error }"}
          - {d: 1, t: 0, k: ret, l: "F3.6. appendBubble(\"AI\", \"Could not pause: ...\")"}
  - frame: opt
    sections:
      - guard: "[session.PauseCount >= MaxPauseCount (3)]"
        body:
          - {d: 6, t: 5, k: ret, l: "F4.1. throw InvalidOperationException"}
          - {d: 5, t: 4, k: ret, l: "F4.2. Return 400 ApiResponse.Fail(ex.Message)"}
          - {d: 4, t: 3, k: ret, l: "F4.3. Return 400"}
          - {d: 3, t: 2, k: ret, l: "F4.4. Return ApiCallResult.Fail(message, 400)"}
          - {d: 2, t: 1, k: ret, l: "F4.5. Return 400 { error }"}
          - {d: 1, t: 0, k: ret, l: "F4.6. appendBubble(\"AI\", \"Could not pause: ...\")"}
  - frame: opt
    sections:
      - guard: "[session.TotalPausedSeconds >= MaxTotalPausedSeconds (300)]"
        body:
          - {d: 6, t: 5, k: ret, l: "F5.1. throw InvalidOperationException"}
          - {d: 5, t: 4, k: ret, l: "F5.2. Return 400 ApiResponse.Fail(ex.Message)"}
          - {d: 4, t: 3, k: ret, l: "F5.3. Return 400"}
          - {d: 3, t: 2, k: ret, l: "F5.4. Return ApiCallResult.Fail(message, 400)"}
          - {d: 2, t: 1, k: ret, l: "F5.5. Return 400 { error }"}
          - {d: 1, t: 0, k: ret, l: "F5.6. appendBubble(\"AI\", \"Could not pause: ...\")"}
  - {d: 6, t: 6, k: call, l: "13. session.Status=\"Paused\"; PausedAt=now; PauseCount+=1", self: true}
  - {d: 6, t: 7, k: call, l: "14. SaveChangesAsync(ct)"}
  - {d: 7, t: 8, k: call, l: "15. UPDATE InterviewSessions SET Status, PausedAt, PauseCount"}
  - {d: 8, t: 7, k: ret, l: "16. Return rows affected"}
  - {d: 7, t: 6, k: ret, l: "17. Return"}
  - {d: 6, t: 6, k: call, l: "18. PausesRemaining, PausedSecondsRemaining recomputed", self: true}
  - {d: 6, t: 5, k: ret, l: "19. Return PauseResponse"}
  - {d: 5, t: 4, k: ret, l: "20. Return 200 ApiResponse.Ok(result)"}
  - {d: 4, t: 3, k: ret, l: "21. Return 200"}
  - {d: 3, t: 2, k: ret, l: "22. Return ApiCallResult.Ok(PauseResponse, 200)"}
  - {d: 2, t: 1, k: ret, l: "23. Return 200 JSON (PauseResponse)"}
  - {d: 1, t: 1, k: call, l: "24. Apply data.*; setStatusDisplay(\"Paused\"); setPausedUI(true)", self: true}
  - {d: 1, t: 1, k: call, l: "25. startPauseQuotaTick()", self: true}
  - {d: 1, t: 0, k: ret, l: "26. Show pause overlay; countdown frozen; controls disabled"}

  # ---------------- Phase 2: Resume ----------------
  - {d: 0, t: 1, k: call, l: "27. Click Resume Interview OR [auto] quota hit 0"}
  - {d: 1, t: 1, k: call, l: "28. resumeInterview(): guard, then resumeBtn.disabled = true", self: true}
  - frame: opt
    sections:
      - guard: "[!paused OR !unpauseUrl]"
        body:
          - {d: 1, t: 1, k: call, l: "F6.1. return early - no request sent", self: true}
          - {d: 1, t: 0, k: ret, l: "F6.2. Nothing happens (still on the paused screen)"}
  - {d: 1, t: 2, k: call, l: "29. POST /Interview/Unpause?id={sessionId} (postProxy fetch)"}
  - {d: 2, t: 3, k: call, l: "30. UnpauseSessionAsync(id, ct)"}
  - {d: 3, t: 4, k: call, l: "31. POST api/interview/sessions/{sessionId}/unpause"}
  - {d: 4, t: 5, k: call, l: "32. Forward (route interview-route, no prefix strip)"}
  - {d: 5, t: 5, k: call, l: "33. Guid.Parse(User.FindFirstValue(ClaimTypes.NameIdentifier))", self: true}
  - {d: 5, t: 6, k: call, l: "34. UnpauseSessionAsync(userId, sessionId, ct)"}
  - {d: 6, t: 7, k: call, l: "35. GetByIdAsync(sessionId, ct)"}
  - {d: 7, t: 8, k: call, l: "36. SELECT InterviewSession WHERE SessionId AND !IsDeleted"}
  - {d: 8, t: 7, k: ret, l: "37. Return session row / null"}
  - {d: 7, t: 6, k: ret, l: "38. Return InterviewSession?"}
  - frame: opt
    sections:
      - guard: "[session is null OR session.UserId != userId]"
        body:
          - {d: 6, t: 5, k: ret, l: 'F7.1. throw InvalidOperationException("Session not found.")'}
          - {d: 5, t: 4, k: ret, l: "F7.2. Return 400 ApiResponse.Fail(ex.Message)"}
          - {d: 4, t: 3, k: ret, l: "F7.3. Return 400"}
          - {d: 3, t: 2, k: ret, l: "F7.4. Return ApiCallResult.Fail(message, 400)"}
          - {d: 2, t: 1, k: ret, l: "F7.5. Return 400 { error }"}
          - {d: 1, t: 0, k: ret, l: "F7.6. appendBubble(\"AI\", \"Could not resume: ...\")"}
  - frame: opt
    sections:
      - guard: '[session.Status != "Paused" OR session.PausedAt is null]'
        body:
          - {d: 6, t: 5, k: ret, l: 'F8.1. throw InvalidOperationException("Session is not paused.")'}
          - {d: 5, t: 4, k: ret, l: "F8.2. Return 400 ApiResponse.Fail(ex.Message)"}
          - {d: 4, t: 3, k: ret, l: "F8.3. Return 400"}
          - {d: 3, t: 2, k: ret, l: "F8.4. Return ApiCallResult.Fail(message, 400)"}
          - {d: 2, t: 1, k: ret, l: "F8.5. Return 400 { error }"}
          - {d: 1, t: 0, k: ret, l: "F8.6. appendBubble(\"AI\", \"Could not resume: ...\")"}
  - {d: 6, t: 6, k: call, l: "39. TotalPausedSeconds += now - PausedAt; Status=\"InProgress\"", self: true}
  - {d: 6, t: 7, k: call, l: "40. SaveChangesAsync(ct)"}
  - {d: 7, t: 8, k: call, l: "41. UPDATE InterviewSessions SET Status, TotalPausedSeconds"}
  - {d: 8, t: 7, k: ret, l: "42. Return rows affected"}
  - {d: 7, t: 6, k: ret, l: "43. Return"}
  - {d: 6, t: 6, k: call, l: "44. elapsed = now - StartedAt - paused; remaining = Max(0, ...)", self: true}
  - {d: 6, t: 5, k: ret, l: "45. Return UnpauseResponse"}
  - {d: 5, t: 4, k: ret, l: "46. Return 200 ApiResponse.Ok(result)"}
  - {d: 4, t: 3, k: ret, l: "47. Return 200"}
  - {d: 3, t: 2, k: ret, l: "48. Return ApiCallResult.Ok(UnpauseResponse, 200)"}
  - {d: 2, t: 1, k: ret, l: "49. Return 200 JSON (UnpauseResponse)"}
  - {d: 1, t: 1, k: call, l: "50. Apply data.*; setPausedUI(false); stopPauseQuotaTick()", self: true}
  - {d: 1, t: 0, k: ret, l: "51. Hide overlay; countdown resumes; inputs re-enabled"}
