include:
  - file: Controller.yaml
    column: 0
  - file: ControllerBase.yaml
    column: 2
  - file: ApiResponse.yaml
    name: "ApiResponse<T> (InterviewAPI)"
    column: 3
  - file: InterviewDbContext.yaml
    column: 4
  - file: DbContext.yaml
    column: 4

classes:
  # ---------- column 0: the two WebClient entry points ----------
  - name: "ProfileController (WebClient)"
    column: 0
    w: 380
    fields:
      - "- biometricsService: IBiometricsService"
      - "- interviewService: IInterviewService"
    methods:
      - "+ Identity(ct: CancellationToken): Task<IActionResult>"

  - name: "InterviewController (WebClient)"
    column: 0
    w: 380
    fields:
      - "- interviewService: IInterviewService"
      - "- biometricsService: IBiometricsService"
    methods:
      - "+ Start(model: DashboardViewModel, ct: CancellationToken): Task<IActionResult>"

  - name: "IBiometricsService (WebClient)"
    column: 0
    w: 400
    fields: []
    methods:
      - "+ GetStatusAsync(ct: CancellationToken): Task<(bool Success, BiometricStatusModel? Status, string? Error)>"
      - "+ EnrollAsync(modality: string, data: byte[], fileName: string, contentType: string, ct: CancellationToken): Task<(bool Success, BiometricEnrollModel? Result, string? Error)>"

  - name: "BiometricsService (WebClient)"
    column: 0
    w: 400
    fields:
      - "- apiClient: IApiClient"
      - "- JsonOptions: JsonSerializerOptions"
    methods:
      - "+ GetStatusAsync(ct: CancellationToken): Task<(bool Success, BiometricStatusModel? Status, string? Error)>"
      - "+ EnrollAsync(modality: string, data: byte[], fileName: string, contentType: string, ct: CancellationToken): Task<(bool Success, BiometricEnrollModel? Result, string? Error)>"
      - "- ReadEnvelopeAsync<T>(response: HttpResponseMessage, ct: CancellationToken): Task<ApiResponse<T>?>"

  # ---------- column 1: WebClient view models ----------
  - name: BiometricsViewModel
    column: 1
    w: 320
    fields:
      - "+ Status: BiometricStatusModel"
      - "+ ErrorMessage: string?"
      - "+ RecentSessions: List<SessionHistoryItemDto>"
    methods: []

  - name: BiometricStatusModel
    column: 1
    w: 320
    fields:
      - "+ FaceEnrolled: bool"
      - "+ FaceUpdatedAt: DateTime?"
      - "+ VoiceEnrolled: bool"
      - "+ VoiceUpdatedAt: DateTime?"
    methods: []

  # ---------- column 2: InterviewAPI controller + service ----------
  - name: "ProfileBiometricsController (InterviewAPI)"
    column: 2
    w: 400
    fields:
      - "- _service: IProfileBiometricsService"
      - "- _logger: ILogger<ProfileBiometricsController>"
    methods:
      - "+ GetStatus(ct: CancellationToken): Task<IActionResult>"

  - name: IProfileBiometricsService
    column: 2
    w: 420
    fields: []
    methods:
      - "+ GetStatusAsync(userId: Guid, ct: CancellationToken): Task<BiometricStatusResponse>"
      - "+ EnrollAsync(userId: Guid, modality: string, file: IFormFile, ct: CancellationToken): Task<BiometricEnrollResponse>"

  - name: "ProfileBiometricsService (InterviewAPI)"
    column: 2
    w: 420
    fields:
      - "- _repository: IProfileBiometricsRepository"
      - "+ ModalityFace: string"
      - "+ ModalityVoice: string"
    methods:
      - "+ GetStatusAsync(userId: Guid, ct: CancellationToken): Task<BiometricStatusResponse>"
      - "+ EnrollAsync(userId: Guid, modality: string, file: IFormFile, ct: CancellationToken): Task<BiometricEnrollResponse>"

  # ---------- column 3: DTO ----------
  - name: BiometricStatusResponse
    column: 3
    w: 320
    fields:
      - "+ FaceEnrolled: bool"
      - "+ FaceUpdatedAt: DateTime?"
      - "+ VoiceEnrolled: bool"
      - "+ VoiceUpdatedAt: DateTime?"
    methods: []

  # ---------- column 4: repository + DbContext ----------
  - name: IProfileBiometricsRepository
    column: 4
    w: 400
    fields: []
    methods:
      - "+ GetAsync(userId: Guid, modality: string, ct: CancellationToken): Task<ProfileBiometric?>"
      - "+ ListByUserAsync(userId: Guid, ct: CancellationToken): Task<List<ProfileBiometric>>"
      - "+ ListByModalityAsync(modality: string, ct: CancellationToken): Task<List<ProfileBiometric>>"
      - "+ AddAsync(entity: ProfileBiometric, ct: CancellationToken): Task"
      - "+ SaveChangesAsync(ct: CancellationToken): Task"

  - name: "ProfileBiometricsRepository (InterviewAPI)"
    column: 4
    w: 400
    fields:
      - "- _db: InterviewDbContext"
    methods:
      - "+ GetAsync(userId: Guid, modality: string, ct: CancellationToken): Task<ProfileBiometric?>"
      - "+ ListByUserAsync(userId: Guid, ct: CancellationToken): Task<List<ProfileBiometric>>"
      - "+ ListByModalityAsync(modality: string, ct: CancellationToken): Task<List<ProfileBiometric>>"
      - "+ AddAsync(entity: ProfileBiometric, ct: CancellationToken): Task"
      - "+ SaveChangesAsync(ct: CancellationToken): Task"

  # ---------- column 5: entity ----------
  - name: ProfileBiometric
    column: 5
    w: 300
    fields:
      - "+ Id: long"
      - "+ UserId: Guid"
      - "+ Modality: string"
      - "+ Embedding: byte[]"
      - "+ Dim: int"
      - "+ ModelVersion: string"
      - "+ Quality: double?"
      - "+ CreatedAt: DateTime"
      - "+ UpdatedAt: DateTime"
    methods: []

relations:
  - {from: "ProfileController (WebClient)", to: Controller, type: extends}
  - {from: "InterviewController (WebClient)", to: Controller, type: extends}
  - {from: "ProfileController (WebClient)", to: "IBiometricsService (WebClient)", type: use, label: Use}
  - {from: "InterviewController (WebClient)", to: "IBiometricsService (WebClient)", type: use, label: Use}
  - {from: "ProfileController (WebClient)", to: BiometricsViewModel, type: use, label: Use}
  - {from: "BiometricsService (WebClient)", to: "IBiometricsService (WebClient)", type: implements}
  - {from: BiometricsViewModel, to: BiometricStatusModel, type: composition, label: "1"}
  - {from: "ProfileBiometricsController (InterviewAPI)", to: ControllerBase, type: extends}
  - {from: "ProfileBiometricsController (InterviewAPI)", to: IProfileBiometricsService, type: use, label: Use}
  - {from: "ProfileBiometricsController (InterviewAPI)", to: "ApiResponse<T> (InterviewAPI)", type: use, label: Use}
  - {from: "ProfileBiometricsService (InterviewAPI)", to: IProfileBiometricsService, type: implements}
  - {from: "ProfileBiometricsService (InterviewAPI)", to: IProfileBiometricsRepository, type: use, label: Use}
  - {from: "ProfileBiometricsService (InterviewAPI)", to: BiometricStatusResponse, type: use, label: Use}
  - {from: "ProfileBiometricsRepository (InterviewAPI)", to: IProfileBiometricsRepository, type: implements}
  - {from: "ProfileBiometricsRepository (InterviewAPI)", to: InterviewDbContext, type: composition}
  - {from: InterviewDbContext, to: DbContext, type: extends}
  - {from: InterviewDbContext, to: ProfileBiometric, type: composition, label: "1..*"}
