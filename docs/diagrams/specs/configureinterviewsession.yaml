feature: ConfigureInterviewSession
title: Configure Interview Session
uc_id: ""
uc_label: "[UC-32, 33, 39]"
backlog: [31, 32, 33, 36]

participants:
  - name: Candidate
    kind: actor
    w: 30
  - name: ":Interview Dashboard UI"
    kind: box
    w: 210
  - name: ":InterviewController\n(WebClient)"
    kind: box
    w: 200
  - name: ":BiometricsService\n(WebClient)"
    kind: box
    w: 200
  - name: ":InterviewService\n(WebClient)"
    kind: box
    w: 190
  - name: ":API Gateway"
    kind: box
    w: 140
  - name: ":InterviewSessionController\n(InterviewAPI)"
    kind: box
    w: 250
  - name: ":SessionService\n(InterviewAPI)"
    kind: box
    w: 190
  - name: ":SessionRepository\n(InterviewAPI)"
    kind: box
    w: 200
  - name: ":AiServiceClient\n(InterviewAPI)"
    kind: box
    w: 190
  - name: ":ai-service\n/catalog"
    kind: box
    w: 180
  - name: "SQL Server"
    kind: db
    w: 70

flow:
  # ---------------- Phase 0: load the catalog (BL#36) ----------------
  - {d: 0, t: 1, k: call, l: "1. Open the interview dashboard"}
  - {d: 1, t: 2, k: call, l: "2. GET /Interview/Catalog"}
  - {d: 2, t: 4, k: call, l: "3. GetCatalogAsync(ct)"}
  - {d: 4, t: 5, k: call, l: "4. GET api/interview/catalog"}
  - {d: 5, t: 6, k: call, l: "5. Forward (route interview-route, no prefix strip)"}
  - {d: 6, t: 9, k: call, l: "6. GetCatalogAsync(ct)"}
  - {d: 9, t: 10, k: call, l: "7. GET /catalog (header X-Internal-Api-Key)"}
  - {d: 10, t: 10, k: call, l: "8. chroma_store.catalog()", self: true}
  - frame: opt
    sections:
      - guard: "[ai-service GET /catalog fails - non-2xx, unreachable, or unreadable JSON]"
        body:
          - {d: 10, t: 9, k: ret, l: "A.1. Non-2xx / no response"}
          - {d: 9, t: 6, k: ret, l: "A.2. throw (logged: Call to ai-service GET /catalog failed)"}
          - {d: 6, t: 5, k: ret, l: "A.3. Return 400 ApiResponse.Fail(ex.Message)"}
          - {d: 5, t: 4, k: ret, l: "A.4. Return 400"}
          - {d: 4, t: 2, k: ret, l: "A.5. Return (false, null, error)"}
          - {d: 2, t: 1, k: ret, l: 'A.6. Return 400 { error: "Could not load the catalog." }'}
          - {d: 1, t: 1, k: call, l: "A.7. response.json() parses the 400 body; techByRole = {}", self: true}
          - {d: 1, t: 0, k: ret, l: "A.8. Show \"No technologies found for this role.\""}
  - {d: 10, t: 9, k: ret, l: "9. 200 { roles: [...], technologies: { role: [...] } }"}
  - {d: 9, t: 6, k: ret, l: "10. Return AiCatalogResponse{Roles, Technologies}"}
  - {d: 6, t: 5, k: ret, l: "11. Return 200 ApiResponse.Ok(catalog)"}
  - {d: 5, t: 4, k: ret, l: "12. Return 200"}
  - {d: 4, t: 2, k: ret, l: "13. Return (true, CatalogResponse, null)"}
  - {d: 2, t: 1, k: ret, l: "14. Return 200 JSON (catalog)"}
  - {d: 1, t: 1, k: call, l: "15. Replace Job Role options; renderFocus()", self: true}
  - {d: 1, t: 0, k: ret, l: "16. Show Job Role list and Focus Area chips"}

  # ---------------- Phase 1: Start - biometric gate + 3 config calls ----------------
  - {d: 0, t: 1, k: call, l: "17. Choose Job Role / Level / Duration / JD / Focus Areas"}
  - {d: 1, t: 2, k: call, l: "18. POST /Interview/Start (form + antiforgery token)"}
  - {d: 2, t: 3, k: call, l: "19. GetStatusAsync(ct) [see #22]"}
  - {d: 3, t: 2, k: ret, l: "20. Return (Success, BiometricStatusModel, Error)"}
  - frame: opt
    sections:
      - guard: "[status loaded AND !FaceEnrolled]"
        body:
          - {d: 2, t: 1, k: ret, l: "B.1. 302 RedirectToAction(\"Identity\", \"Profile\")"}
          - {d: 1, t: 0, k: ret, l: "B.2. Profile > Identity page [see #1]"}
  - {d: 2, t: 4, k: call, l: "21. StartInterviewAsync(...)"}
  - {d: 4, t: 5, k: call, l: "22. PUT api/interview/sessions/config/duration"}
  - {d: 5, t: 6, k: call, l: "23. Forward (route interview-route, no prefix strip)"}
  - {d: 6, t: 6, k: call, l: "24. Guid.Parse(User.FindFirstValue(ClaimTypes.NameIdentifier))", self: true}
  - {d: 6, t: 7, k: call, l: "25. ConfigDurationAsync(userId, req, ct)"}
  - frame: opt
    sections:
      - guard: "[DurationMinutes not in (15, 30, 45, 60)]"
        body:
          - {d: 7, t: 6, k: ret, l: "C.1. throw InvalidOperationException"}
          - {d: 6, t: 5, k: ret, l: "C.2. Return 400 ApiResponse.Fail(ex.Message)"}
          - {d: 5, t: 4, k: ret, l: "C.3. Return 400"}
          - {d: 4, t: 2, k: ret, l: "C.4. Return StartInterviewResult.Failure(message)"}
          - {d: 2, t: 1, k: ret, l: "C.5. Return View Index"}
          - {d: 1, t: 0, k: ret, l: "C.6. Dashboard with the error banner"}
  - {d: 7, t: 8, k: call, l: "26. ResolveSessionAsync(null) -> GetActiveSessionAsync(...)"}
  - {d: 8, t: 11, k: call, l: "27. SELECT InterviewSession WHERE Status IN (\"InProgress\",...)"}
  - {d: 11, t: 8, k: ret, l: "28. Return row / null"}
  - {d: 8, t: 7, k: ret, l: "29. Return InterviewSession?"}
  - frame: opt
    sections:
      - guard: "[an InProgress / Paused session already exists for this user]"
        body:
          - {d: 7, t: 6, k: ret, l: "D.1. throw SessionGuardException(409, \"active_session_exists\")"}
          - {d: 6, t: 5, k: ret, l: "D.2. Return 409 {error, activeSessionId}"}
          - {d: 5, t: 4, k: ret, l: "D.3. Return 409"}
          - {d: 4, t: 2, k: ret, l: "D.4. Return StartInterviewResult.ActiveSessionConflict(...)"}
          - {d: 2, t: 1, k: ret, l: "D.5. 302 RedirectToAction(Room, { id = activeSessionId })"}
          - {d: 1, t: 0, k: ret, l: "D.6. Interview Room of the session in progress [see #4]"}
  - {d: 7, t: 8, k: call, l: "30. CreateAsync(InterviewSession{Status=\"Configured\"})"}
  - {d: 8, t: 11, k: call, l: "31. INSERT InterviewSession (SaveChangesAsync)"}
  - {d: 11, t: 8, k: ret, l: "32. Return rows affected"}
  - {d: 8, t: 7, k: ret, l: "33. Return InterviewSession"}
  - {d: 7, t: 6, k: ret, l: "34. Return ConfigResponse{UpdatedField=\"DurationMinutes\"}"}
  - {d: 6, t: 5, k: ret, l: "35. Return 200 ApiResponse.Ok(result)"}
  - {d: 5, t: 4, k: ret, l: "36. Return 200"}

  - {d: 4, t: 5, k: call, l: "37. PUT api/interview/sessions/config/level"}
  - {d: 5, t: 6, k: call, l: "38. Forward (route interview-route, no prefix strip)"}
  - {d: 6, t: 7, k: call, l: "39. ConfigLevelAsync(userId from the JWT claim, req, ct)"}
  - frame: opt
    sections:
      - guard: "[Level not in (Intern, Fresher, Junior, Middle, Senior, Lead)]"
        body:
          - {d: 7, t: 6, k: ret, l: 'E1.1. throw InvalidOperationException("Invalid level.")'}
          - {d: 6, t: 5, k: ret, l: "E1.2. Return 400 ApiResponse.Fail(ex.Message)"}
          - {d: 5, t: 4, k: ret, l: "E1.3. Return 400"}
          - {d: 4, t: 2, k: ret, l: "E1.4. Return StartInterviewResult.Failure(error)"}
          - {d: 2, t: 1, k: ret, l: "E1.5. Return View Index (dashboard + ErrorMessage)"}
          - {d: 1, t: 0, k: ret, l: "E1.6. Dashboard with the error banner"}
  - {d: 7, t: 8, k: call, l: "40. ResolveSessionAsync(sessionId) -> GetByIdAsync(...)"}
  - {d: 8, t: 11, k: call, l: "41. SELECT InterviewSession WHERE SessionId AND !IsDeleted"}
  - {d: 11, t: 8, k: ret, l: "42. Return row / null"}
  - {d: 8, t: 7, k: ret, l: "43. Return InterviewSession?"}
  - frame: opt
    sections:
      - guard: '[session is null OR session.UserId != userId OR session.Status != "Configured"]'
        body:
          - {d: 7, t: 6, k: ret, l: "E2.1. throw InvalidOperationException"}
          - {d: 6, t: 5, k: ret, l: "E2.2. Return 400 ApiResponse.Fail(ex.Message)"}
          - {d: 5, t: 4, k: ret, l: "E2.3. Return 400"}
          - {d: 4, t: 2, k: ret, l: "E2.4. Return StartInterviewResult.Failure(error)"}
          - {d: 2, t: 1, k: ret, l: "E2.5. Return View Index (dashboard + ErrorMessage)"}
          - {d: 1, t: 0, k: ret, l: "E2.6. Dashboard with the error banner"}
  - {d: 7, t: 8, k: call, l: "44. SaveChangesAsync(ct)"}
  - {d: 8, t: 11, k: call, l: "45. UPDATE InterviewSession SET Level, UpdatedAt"}
  - {d: 11, t: 8, k: ret, l: "46. Return rows affected"}
  - {d: 8, t: 7, k: ret, l: "47. Return"}
  - {d: 7, t: 6, k: ret, l: "48. Return ConfigResponse{UpdatedField=\"Level\"}"}
  - {d: 6, t: 5, k: ret, l: "49. Return 200 ApiResponse.Ok(result)"}
  - {d: 5, t: 4, k: ret, l: "50. Return 200"}

  - {d: 4, t: 5, k: call, l: "51. PUT api/interview/sessions/config/interaction"}
  - {d: 5, t: 6, k: call, l: "52. Forward (route interview-route, no prefix strip)"}
  - {d: 6, t: 7, k: call, l: "53. ConfigInteractionAsync(userId from the JWT claim, req, ct)"}
  - frame: opt
    sections:
      - guard: '[Mode not in ("Text", "Voice")]'
        body:
          - {d: 7, t: 6, k: ret, l: 'F1.1. throw InvalidOperationException("Invalid interaction mode.")'}
          - {d: 6, t: 5, k: ret, l: "F1.2. Return 400 ApiResponse.Fail(ex.Message)"}
          - {d: 5, t: 4, k: ret, l: "F1.3. Return 400"}
          - {d: 4, t: 2, k: ret, l: "F1.4. Return StartInterviewResult.Failure(error)"}
          - {d: 2, t: 1, k: ret, l: "F1.5. Return View Index (dashboard + ErrorMessage)"}
          - {d: 1, t: 0, k: ret, l: "F1.6. Dashboard with the error banner"}
  - {d: 7, t: 8, k: call, l: "54. ResolveSessionAsync(sessionId) -> GetByIdAsync(...)"}
  - {d: 8, t: 11, k: call, l: "55. SELECT InterviewSession WHERE SessionId AND !IsDeleted"}
  - {d: 11, t: 8, k: ret, l: "56. Return row / null"}
  - {d: 8, t: 7, k: ret, l: "57. Return InterviewSession?"}
  - frame: opt
    sections:
      - guard: '[session is null OR session.UserId != userId OR session.Status != "Configured"]'
        body:
          - {d: 7, t: 6, k: ret, l: "F2.1. throw InvalidOperationException"}
          - {d: 6, t: 5, k: ret, l: "F2.2. Return 400 ApiResponse.Fail(ex.Message)"}
          - {d: 5, t: 4, k: ret, l: "F2.3. Return 400"}
          - {d: 4, t: 2, k: ret, l: "F2.4. Return StartInterviewResult.Failure(error)"}
          - {d: 2, t: 1, k: ret, l: "F2.5. Return View Index (dashboard + ErrorMessage)"}
          - {d: 1, t: 0, k: ret, l: "F2.6. Dashboard with the error banner"}
  - {d: 7, t: 8, k: call, l: "58. SaveChangesAsync(ct)"}
  - {d: 8, t: 11, k: call, l: "59. UPDATE InterviewSession SET InteractionMode, UpdatedAt"}
  - {d: 11, t: 8, k: ret, l: "60. Return rows affected"}
  - {d: 8, t: 7, k: ret, l: "61. Return"}
  - {d: 7, t: 6, k: ret, l: "62. Return ConfigResponse{UpdatedField=\"InteractionMode\"}"}
  - {d: 6, t: 5, k: ret, l: "63. Return 200 ApiResponse.Ok(result)"}
  - {d: 5, t: 4, k: ret, l: "64. Return 200"}

  - {d: 4, t: 5, k: call, l: "65. POST api/interview/sessions/init [see #4]"}
  - {d: 5, t: 4, k: ret, l: "66. Return 200 InitResponse / non-2xx"}
  - frame: opt
    sections:
      - guard: "[the init call failed - see #4 StartInterviewSession]"
        body:
          - {d: 4, t: 2, k: ret, l: "G.1. Return StartInterviewResult.Failure(...)"}
          - {d: 2, t: 1, k: ret, l: "G.2. Return View Index (dashboard + ErrorMessage)"}
          - {d: 1, t: 0, k: ret, l: "G.3. Dashboard with the error banner"}
  - {d: 4, t: 2, k: ret, l: "67. Return StartInterviewResult.Ok(sessionId)"}
  - {d: 2, t: 1, k: ret, l: "68. 302 RedirectToAction(Verify, { id = sessionId })"}
  - {d: 1, t: 0, k: ret, l: "69. Biometric entry-gate screen [see #13]"}
